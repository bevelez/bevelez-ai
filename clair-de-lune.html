<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clair de Lune — Claude Debussy</title>
  <meta name="description" content="An interactive study of Claude Debussy's Clair de Lune for dark felt grand piano." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #08080a;
      --ivory: #ede9e0;
      --muted: rgba(237, 233, 224, 0.48);
      --faint: rgba(237, 233, 224, 0.14);
      --brass: #c8ad78;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--ivory);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      touch-action: none;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      z-index: 1;
      cursor: pointer;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(circle at 50% 54%, transparent 45%, rgba(4, 4, 6, 0.86) 100%);
    }

    /* Subtle floating invitation before first interaction (no modal box) */
    .whisper-prompt {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
       flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }

    .whisper-prompt.fade-out {
      opacity: 0;
    }

    .whisper-text {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.45rem;
      font-style: italic;
      font-weight: 400;
      letter-spacing: 0.02em;
      color: var(--ivory);
      background: rgba(8, 8, 10, 0.55);
      padding: 10px 24px;
      border-radius: 999px;
      border: 1px solid var(--faint);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    /* Minimalist Architectural Overlay */
    .ui {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 36px;
    }

    .top-bar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 20px;
    }

    .piece-header {
      pointer-events: auto;
    }

    .piece-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.75rem;
      font-weight: 500;
      font-style: italic;
      color: var(--ivory);
      line-height: 1.05;
    }

    .piece-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.64rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 5px;
    }

    .top-nav {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .nav-link {
      appearance: none;
      border: none;
      background: none;
      color: var(--muted);
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.01em;
      cursor: pointer;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--ivory);
    }

    /* Minimal Bottom Bar */
    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      border-top: 1px solid var(--faint);
      padding-top: 16px;
    }

    .left-status {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .play-btn {
      appearance: none;
      border: none;
      background: none;
      color: var(--ivory);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--brass);
      transition: opacity 0.25s ease;
    }

    .harmonic-label {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.05rem;
      font-style: italic;
      color: var(--muted);
    }

    /* Hairline Acoustic Controls */
    .acoustics-group {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .control-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.64rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .hairline-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 72px;
      height: 1px;
      background: rgba(237, 233, 224, 0.28);
      outline: none;
      cursor: pointer;
    }

    .hairline-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--ivory);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .hairline-slider::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }

    @media (max-width: 768px) {
      .ui {
        padding: 18px 20px;
      }
      .bottom-bar {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
      .acoustics-group {
        width: 100%;
        justify-content: space-between;
        gap: 12px;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container" aria-label="3D Dark Grand Piano"></div>
  <div class="vignette" aria-hidden="true"></div>

  <div class="whisper-prompt" id="whisper-prompt">
    <div class="whisper-text">Touch any key to begin</div>
  </div>

  <div class="ui">
    <header class="top-bar">
      <div class="piece-header">
        <h1 class="piece-title">Clair de Lune</h1>
        <div class="piece-sub">Claude Debussy · Suite bergamasque, L. 75</div>
      </div>

      <nav class="top-nav">
        <button id="btn-mode" class="nav-link" type="button" title="Switch between automatic performance and playing each chord by touch">
          Mode: Auto
        </button>
        <button id="btn-camera" class="nav-link" type="button">
          Perspective
        </button>
        <a href="./vault.html" class="nav-link">Archive</a>
      </nav>
    </header>

    <footer class="bottom-bar">
      <div class="left-status">
        <button id="btn-play" class="play-btn" type="button">
          <span class="status-dot" id="status-dot"></span>
          <span id="play-label">Playing</span>
        </button>
        <span class="harmonic-label" id="harmonic-label">Andante très expressif — D♭ major</span>
      </div>

      <div class="acoustics-group">
        <label class="control-item">
          <span>Felt</span>
          <input id="slider-felt" class="hairline-slider" type="range" min="15" max="95" value="76" />
        </label>

        <label class="control-item">
          <span>Space</span>
          <input id="slider-reverb" class="hairline-slider" type="range" min="15" max="95" value="70" />
        </label>

        <label class="control-item">
          <span>Tempo</span>
          <input id="slider-tempo" class="hairline-slider" type="range" min="65" max="135" value="100" />
        </label>
      </div>
    </footer>
  </div>

  <script type="module" src="./clair-de-lune.js?v=6"></script>
</body>
</html>
