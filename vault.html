<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Archive — Brandon Edward Velez</title>
  <meta name="description" content="Selected interactive works and musical experiments by Brandon Edward Velez." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #f4f3ef;
      --bg-gradient: radial-gradient(circle at 50% 38%, #faf9f6 0%, #f1efe9 65%, #e6e3db 100%);
      --ink: #141413;
      --ink-muted: #6e6c66;
      --ink-faint: rgba(20, 20, 19, 0.10);
    }

    html.theme-dark,
    body.theme-dark {
      --bg: #0c0c0e;
      --bg-gradient: radial-gradient(circle at 50% 38%, #17181d 0%, #0d0d10 68%, #070709 100%);
      --ink: #f2f0ea;
      --ink-muted: #94928c;
      --ink-faint: rgba(242, 240, 234, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      width: 100%;
      background-color: var(--bg);
      overflow-x: hidden;
    }

    body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg);
      background-image: var(--bg-gradient);
      color: var(--ink);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    .page-shell {
      position: relative;
      max-width: 1320px;
      margin: 0 auto;
      padding: 28px 44px 88px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Minimal Top Bar */
    .header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 14px;
    }

    .brand-name {
      font-size: 0.84rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--ink);
      text-decoration: none;
    }

    .brand-sep {
      color: var(--ink-muted);
      font-weight: 300;
      font-size: 0.75rem;
    }

    .brand-section {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .deck-controls {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.66rem;
      letter-spacing: 0.06em;
      color: var(--ink-muted);
    }

    .deck-btn {
      appearance: none;
      border: none;
      background: none;
      color: var(--ink-muted);
      font-family: inherit;
      font-size: inherit;
      letter-spacing: inherit;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s ease;
    }

    .deck-btn:hover,
    .deck-btn.active {
      color: var(--ink);
      font-weight: 500;
    }

    .dot-indicator {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.35;
    }

    .deck-btn.active .dot-indicator {
      opacity: 1;
    }

    .text-btn {
      appearance: none;
      border: none;
      background: none;
      color: var(--ink-muted);
      font-family: 'Inter', sans-serif;
      font-size: 0.76rem;
      font-weight: 400;
      letter-spacing: 0.01em;
      cursor: pointer;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .text-btn:hover {
      color: var(--ink);
    }

    /* Open, Frameless 2-Across Gallery Layout (No Boxes, No Bento Borders, No Opaque Overlays) */
    .tape-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: 56px;
      row-gap: 64px;
      width: 100%;
      margin-top: 8px;
    }

    .tape-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: transparent;
      border: none;
      padding: 0;
    }

    .tape-card.unlocked {
      cursor: pointer;
    }

    .tape-card.locked {
      opacity: 0.75;
      cursor: default;
    }

    /* Full unobstructed 3D Cassette stage bound directly inside its DOM slot */
    .tape-stage {
      width: 100%;
      height: 320px;
      position: relative;
      background: transparent;
      touch-action: pan-y;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tape-stage canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      pointer-events: none;
    }

    /* Minimal unboxed caption below each floating cassette */
    .tape-caption {
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: -6px;
    }

    .work-index {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 6px;
    }

    .work-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.95rem;
      font-weight: 500;
      font-style: italic;
      line-height: 1.06;
      color: var(--ink);
      margin-bottom: 8px;
      transition: opacity 0.2s ease;
    }

    .work-desc {
      font-size: 0.80rem;
      font-weight: 400;
      line-height: 1.52;
      color: var(--ink-muted);
      margin-bottom: 14px;
    }

    .open-work-btn {
      appearance: none;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: var(--bg);
      font-family: 'Inter', sans-serif;
      font-size: 0.74rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      padding: 8px 18px;
      border-radius: 999px;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .tape-card.unlocked:hover .open-work-btn {
      opacity: 0.86;
      transform: translateY(-1px);
    }

    .open-work-btn:disabled {
      background: transparent;
      border-color: var(--ink-faint);
      color: var(--ink-muted);
      cursor: default;
    }

    @media (max-width: 860px) {
      .page-shell {
        padding: 18px 20px 64px;
      }
      .tape-grid {
        grid-template-columns: 1fr;
        row-gap: 44px;
      }
      .tape-stage {
        height: 260px;
      }
      .deck-controls {
        display: none;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="page-shell">
    <header class="header">
      <div class="brand">
        <a href="./index.html" class="brand-name">bevelez.ai</a>
        <span class="brand-sep">/</span>
        <span class="brand-section">Cassette Archive</span>
      </div>

      <nav class="nav-right">
        <div class="deck-controls">
          <button id="btn-rewind" class="deck-btn" type="button">
            <span class="dot-indicator"></span>
            <span>Rewind</span>
          </button>
          <button id="btn-reel-play" class="deck-btn active" type="button">
            <span class="dot-indicator"></span>
            <span id="reel-play-label">Playing</span>
          </button>
          <button id="btn-orbit" class="deck-btn active" type="button">
            <span class="dot-indicator"></span>
            <span>360° Orbit</span>
          </button>
        </div>
        <button id="btn-backdrop" class="text-btn" type="button">Dark room</button>
        <a href="./index.html" class="text-btn">Return</a>
      </nav>
    </header>

    <main class="tape-grid" id="tape-grid" aria-label="Cassette Archive"></main>
  </div>

  <script type="module" src="./vault.js?v=10"></script>
</body>
</html>
