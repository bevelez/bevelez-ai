<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Archive — Brandon Edward Velez</title>
  <meta name="description" content="Selected interactive works and musical experiments by Brandon Edward Velez." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #f4f3ef;
      --bg-gradient: radial-gradient(circle at 50% 42%, #faf9f6 0%, #f1efe9 65%, #e6e3db 100%);
      --ink: #141413;
      --ink-muted: #706e68;
      --ink-faint: rgba(20, 20, 19, 0.1);
      --surface: rgba(250, 249, 246, 0.82);
    }

    body.theme-dark {
      --bg: #0c0c0e;
      --bg-gradient: radial-gradient(circle at 50% 42%, #17181d 0%, #0d0d10 68%, #070709 100%);
      --ink: #f2f0ea;
      --ink-muted: #8c8a84;
      --ink-faint: rgba(242, 240, 234, 0.12);
      --surface: rgba(20, 20, 24, 0.78);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-gradient);
      color: var(--ink);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      touch-action: none;
      transition: background 0.4s ease, color 0.4s ease;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      z-index: 1;
      cursor: grab;
    }

    #canvas-container:active {
      cursor: grabbing;
    }

    .layout {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 36px;
    }

    /* Minimal Top Bar */
    .header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      pointer-events: auto;
      display: flex;
      align-items: baseline;
      gap: 14px;
    }

    .brand-name {
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--ink);
      text-decoration: none;
    }

    .brand-sep {
      color: var(--ink-muted);
      font-weight: 300;
      font-size: 0.75rem;
    }

    .brand-section {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    .nav-right {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .text-btn {
      appearance: none;
      border: none;
      background: none;
      color: var(--ink-muted);
      font-family: 'Inter', sans-serif;
      font-size: 0.76rem;
      font-weight: 400;
      letter-spacing: 0.01em;
      cursor: pointer;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .text-btn:hover {
      color: var(--ink);
    }

    /* Bottom Editorial Info & Minimalist Controls */
    .footer {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
      gap: 24px;
    }

    /* Left: Selected Tape Index & Description */
    .work-info {
      pointer-events: auto;
      max-width: 340px;
    }

    .work-index {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.66rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 6px;
    }

    .work-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.85rem;
      font-weight: 500;
      font-style: italic;
      line-height: 1.08;
      color: var(--ink);
      margin-bottom: 6px;
    }

    .work-desc {
      font-size: 0.78rem;
      font-weight: 400;
      line-height: 1.5;
      color: var(--ink-muted);
      margin-bottom: 14px;
    }

    .open-work-btn {
      appearance: none;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: var(--bg);
      font-family: 'Inter', sans-serif;
      font-size: 0.74rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      padding: 8px 18px;
      border-radius: 999px;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .open-work-btn:hover:not(:disabled) {
      opacity: 0.86;
      transform: translateY(-1px);
    }

    .open-work-btn:disabled {
      background: transparent;
      border-color: var(--ink-faint);
      color: var(--ink-muted);
      cursor: default;
    }

    /* Center: Minimalist Tape Switcher & Deck Transport */
    .center-dock {
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .tape-selector {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--surface);
      border: 1px solid var(--ink-faint);
      padding: 4px;
      border-radius: 999px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .tape-pill {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--ink-muted);
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .tape-pill:hover {
      color: var(--ink);
    }

    .tape-pill.active {
      background: var(--ink);
      color: var(--bg);
    }

    .deck-controls {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.66rem;
      letter-spacing: 0.06em;
      color: var(--ink-muted);
    }

    .deck-btn {
      appearance: none;
      border: none;
      background: none;
      color: var(--ink-muted);
      font-family: inherit;
      font-size: inherit;
      letter-spacing: inherit;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s ease;
    }

    .deck-btn:hover {
      color: var(--ink);
    }

    .deck-btn.active {
      color: var(--ink);
      font-weight: 500;
    }

    .dot-indicator {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.35;
    }

    .deck-btn.active .dot-indicator {
      opacity: 1;
    }

    /* Right: Subtle Interaction Note */
    .meta-right {
      justify-self: end;
      text-align: right;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.64rem;
      letter-spacing: 0.06em;
      color: var(--ink-muted);
      line-height: 1.6;
    }

    @media (max-width: 820px) {
      .layout {
        padding: 18px 20px;
      }
      .footer {
        grid-template-columns: 1fr;
        justify-items: center;
        text-align: center;
        gap: 14px;
      }
      .work-info {
        max-width: 100%;
      }
      .meta-right {
        display: none;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container" aria-label="Interactive 3D Cassette Tape"></div>

  <div class="layout">
    <header class="header">
      <div class="brand">
        <a href="./index.html" class="brand-name">bevelez.ai</a>
        <span class="brand-sep">/</span>
        <span class="brand-section">Cassette Archive</span>
      </div>

      <nav class="nav-right">
        <button id="btn-backdrop" class="text-btn" type="button">Dark room</button>
        <a href="./index.html" class="text-btn">Return</a>
      </nav>
    </header>

    <footer class="footer">
      <div class="work-info">
        <div class="work-index" id="work-index">No. 01 — Claude Debussy, 1890</div>
        <h1 class="work-title" id="work-title">Clair de Lune</h1>
        <p class="work-desc" id="work-desc">
          An intimate nocturnal study for dark felt grand piano in D♭ major. Listen or play along directly on the keys.
        </p>
        <button id="btn-open-work" class="open-work-btn" type="button">
          <span id="open-work-label">Listen &amp; Play</span>
          <span>→</span>
        </button>
      </div>

      <div class="center-dock">
        <div class="tape-selector" id="tape-selector" role="tablist"></div>

        <div class="deck-controls">
          <button id="btn-rewind" class="deck-btn" type="button">
            <span class="dot-indicator"></span>
            <span>Rewind</span>
          </button>
          <button id="btn-reel-play" class="deck-btn active" type="button">
            <span class="dot-indicator"></span>
            <span id="reel-play-label">Playing</span>
          </button>
          <button id="btn-orbit" class="deck-btn active" type="button">
            <span class="dot-indicator"></span>
            <span>360° Orbit</span>
          </button>
        </div>
      </div>

      <div class="meta-right">
        <div>DRAG TO INSPECT</div>
        <div>CLICK CASSETTE TO OPEN</div>
      </div>
    </footer>
  </div>

  <script type="module" src="./vault.js?v=7"></script>
</body>
</html>
