ded stern screw, manifolds and gauge</button></span><span class="iso-caption">The Flying Dutchman's ironclad galleon hull, three-masted square rig, and aether-steam propulsion plant on a graving-dock slipway: a 15.5 bar midship Scotch marine boiler feeds superheated steam (382 °C) to twin port and starboard sidewheel aether-levitation sponsons (42.0 tf vertical lift), a shrouded stern Kort propulsor screw beneath the high Dutch poop castle, and three stepped masts carrying furled aether-condenser yards and six broadside brass guns.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {
    const count = flags.length;
    const runs = [];
    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);
    if (start < 0)
        return flags[0] === want ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];
    let run = null;
    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;
        if (flags[index] === want) {
            if (!run)
                run = [index];
            run.push((index + 1) % count);
        }
        else if (run) {
            runs.push(run);
            run = null;
        }
    }
    if (run)
        runs.push(run);
    return runs;
}
function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;
    const count = ring.length;
    const counter = signedArea(ring) > 0;
    const [vx, vy] = towardViewer(projection);
    const { sinA, cosA } = cameraOf(projection);
    const normals = ring.map(([ax, ay], index) => {

        const dx = bx - ax;

        return (counter ? [dy / length, -dx / length] : [-dy / length, dx / length]);

let isLight = document.body.dataset.theme === "light";
try {
  const params = new URLSearchParams(window.location.search);
  if (params.get("theme") === "light") isLight = true;
  else if (params.get("theme") === "dark") isLight = false;
  if (params.get("mode") === "3d") setTimeout(() => setMode3d(true), 0);
} catch (_) {}

const nodes = [...ship.querySelectorAll(".it")].map((el) => ({
  el,
  piece: el.dataset.piece,
  ride: el.dataset.ride || el.dataset.piece,
  key: Number(el.dataset.k),
  m: el.dataset.m.split(",").map(Number),
  index: Number(el.dataset.i),
  shown: "",
}));
for (const node of nodes) node.lift = node.m[0] * D.V[0] + node.m[1] * D.V[1] + node.m[2] * D.V[2];
let order = nodes.map((_, index) => index);

const IDS = Object.keys(D.pieces);
const STAGGER = D.stagger;
const SPRING = D.spring;
const piece = Object.fromEntries(IDS.map((id) => [id, { x: 0, v: 0, target: 0, pending: null }]));
if (!piece.stand) piece.stand = { x: 0, v: 0, target: 0, pending: null };

let clock = 0;
let apart = false;
let selected = null;
let pinned = null;
let stoked = true;
let visible = false;
let frame = 0;
let last = 0;
let leaveTimer = 0;
let mode3d = false;
let dragTool = "orbit"; // "orbit" | "pan"

// Camera state shared across 2D pan/zoom and 3D orbit/pan/zoom
const HOME_AZ = D.P.azimuth ?? 38;
const HOME_EL = D.P.elevation ?? 29;
const cam = {
  az: HOME_AZ,
  el: HOME_EL,
  targetAz: HOME_AZ,
  targetEl: HOME_EL,
  panX: 0,
  panY: 0,
  targetPanX: 0,
  targetPanY: 0,
  zoom: 1,
  targetZoom: 1,
};

const heat = { x: 0.72, v: 0 };
const gaugeTurn = { x: 0.68, v: 0 };

function needleAt(turn) {
  const angle = turn * Math.PI * 2;
  const [x, y] = D.dial;
  const r = D.dialR;
  return lineOnTop(
    [x - Math.sin(angle) * 2.6, y + Math.cos(angle) * 2.6],
    [x + Math.sin(angle) * (r - 3.2), y - Math.cos(angle) * (r - 3.2)],
    D.dialTop + 0.2,
    D.P,
  );
}

function say(text) {
  if (readout.textContent !== text) readout.textContent = text;
}

function updateReadout() {
  if (selected && D.pieces[selected] && D.pieces[selected].say) {
    say(D.pieces[selected].say);
    stage.setAttribute("aria-valuetext", D.pieces[selected].say);
    return;
  }
  const bar = 1.0 + 14.5 * heat.x;
  const liftTf = 42.0 * Math.pow(Math.max(0, (bar - 1) / 14.5), 1.15);
  const knots = 24.0 * Math.pow(Math.max(0, (bar - 1) / 14.5), 0.75);
  if (mode3d) {
    const azDeg = (((Math.round(cam.az) % 360) + 360) % 360);
    const elDeg = Math.round(cam.el);
    const text = `3d view · ${azDeg}° az · ${elDeg}° el · ${Math.round(cam.zoom * 100)}% · ${bar.toFixed(1)} bar`;
    say(text);
    stage.setAttribute("aria-valuetext", text);
    return;
  }
  const text = apart
    ? `apart · 8 assemblies · ${bar.toFixed(1)} bar`
    : `${bar.toFixed(1)} bar · ${liftTf.toFixed(1)} tf lift · ${knots.toFixed(1)} kn`;
  say(text);
  stage.setAttribute("aria-valuetext", text);
}

function updateHint() {
  if (!hint) return;
  if (mode3d) {
    hint.textContent = narrow.matches
      ? "Drag orbit · pinch zoom"
      : "Drag orbit · right-drag pan";
  } else {
    hint.textContent = narrow.matches
      ? "Tap part · pinch zoom"
      : "Click or hover · scroll zoom";
  }
}

function syncThemeUI() {
  const themeName = isLight ? "light" : "dark";
  document.body.dataset.theme = themeName;
  document.documentElement.dataset.theme = themeName;
  if (themeIconTop) themeIconTop.textContent = isLight ? "☾" : "☀";
  if (themeLabelTop) themeLabelTop.textContent = isLight ? "Dark Mode" : "Light Mode";
  if (themeLabelPill) themeLabelPill.textContent = isLight ? "☾ Dark" : "☀ Light";
  run();
}

function setTheme(light) {
  isLight = Boolean(light);
  syncThemeUI();
}

function setDragTool(tool) {
  dragTool = tool === "pan" ? "pan" : "orbit";
  if (dragOrbitBtn) {
    if (dragTool === "orbit") dragOrbitBtn.setAttribute("data-on", "");
    else dragOrbitBtn.removeAttribute("data-on");
  }
  if (dragPanBtn) {
    if (dragTool === "pan") dragPanBtn.setAttribute("data-on", "");
    else dragPanBtn.removeAttribute("data-on");
  }
}

function setApart(on) {
  if (apart === on) return;
  apart = on;
  if (explodeBtn) {
    if (apart) explodeBtn.setAttribute("data-on", "");
    else explodeBtn.removeAttribute("data-on");
  }
  const goal = on ? 1 : 0;
  let index = 0;
  for (const id of on ? STAGGER : [...STAGGER].reverse()) {
    if (!piece[id]) continue;
    if (piece[id].target === goal) piece[id].pending = null;
    else piece[id].pending = { value: goal, at: clock + (still.matches ? 0 : index++ * SPRING.stagger) };
  }
  updateReadout();
  run();
}

function normalizePiece(id) {
  if (!id || id === "stand") return null;
  if (id === "portsponson") return "sponsons";
  if (id === "sternscrew") return "propulsion";
  return id;
}

function select(id) {
  id = normalizePiece(id);
  if (selected === id) return;
  selected = id;
  for (const node of nodes) {
    const match =
      id !== null &&
      (node.piece === id ||
        (id === "sponsons" && node.piece === "portsponson") ||
        (id === "propulsion" && node.piece === "sternscrew"));
    if (match) node.el.setAttribute("data-on", "");
    else node.el.removeAttribute("data-on");
  }
  if (id) stage.setAttribute("data-focus", "");
  else stage.removeAttribute("data-focus");
  partButtons.forEach((button) => (button.dataset.part === id ? button.setAttribute("data-on", "") : button.removeAttribute("data-on")));
  stage.setAttribute("aria-valuenow", String(id ? D.order.indexOf(id) + 1 : 0));
  updateReadout();
  run();
}

function togglePin(id) {
  id = normalizePiece(id);
  if (!id) {
    pinned = null;
    select(null);
    if (!mode3d) setApart(false);
    return;
  }
  if (pinned === id) {
    pinned = null;
    select(null);
    if (!mode3d) setApart(false);
  } else {
    pinned = id;
    setApart(true);
    select(id);
  }
  run();
}

function steerSpring(state, dt, calm) {
  if (state.pending && clock >= state.pending.at) {
    state.target = state.pending.value;
    state.pending = null;
  }
  if (calm) {
    state.x = state.target;
    state.v = 0;
    return false;
  }
  for (let index = 0; index < SPRING.substeps; index++) {
    const h = dt / SPRING.substeps;
    state.v += ((state.target - state.x) * SPRING.stiffness - state.v * SPRING.damping) * h;
    state.x += state.v * h;
  }
  if (Math.abs(state.target - state.x) < 2e-4 && Math.abs(state.v) < 2e-4) {
    state.x = state.target;
    state.v = 0;
    return state.pending !== null;
  }
  return true;
}

function apply2dTransform() {
  if (!wrap2d) return;
  const nearHome = Math.abs(cam.zoom - 1) < 1e-3 && Math.abs(cam.panX) < 0.25 && Math.abs(cam.panY) < 0.25;
  if (nearHome) {
    if (wrap2d.style.transform) wrap2d.style.transform = "";
  } else {
    const pctX = (cam.panX / D.W) * 100;
    const pctY = (cam.panY / D.H) * 100;
    wrap2d.style.transform = `translate(${pctX.toFixed(3)}%, ${pctY.toFixed(3)}%) scale(${cam.zoom.toFixed(4)})`;
  }
}

function place() {
  for (const node of nodes) {
    const share = piece[node.ride].x;
    const tx = (D.EX[0] * node.m[0] + D.EY[0] * node.m[1] + D.EZ[0] * node.m[2]) * share;
    const ty = (D.EX[1] * node.m[0] + D.EY[1] * node.m[1] + D.EZ[1] * node.m[2]) * share;
    const text = share === 0 ? "" : `translate(${tx.toFixed(2)} ${ty.toFixed(2)})`;
    if (text !== node.shown) {
      node.shown = text;
      if (text) node.el.setAttribute("transform", text);
      else node.el.removeAttribute("transform");
    }
  }
  const next = nodes
    .map((_, index) => index)
    .sort((a, b) => nodes[a].key + nodes[a].lift * piece[nodes[a].ride].x - (nodes[b].key + nodes[b].lift * piece[nodes[b].ride].x));
  if (next.some((index, at) => index !== order[at])) {
    const fragment = document.createDocumentFragment();
    for (const index of next) fragment.appendChild(nodes[index].el);
    ship.appendChild(fragment);
    order = next;
  }
  if (needle) needle.setAttribute("d", needleAt(gaugeTurn.x));
  apply2dTransform();
}

  float n = max(max(tNear.x, tNear.y), tNear.z);

  return smoothstep(0.0, 3.0, f - n);
}

void main() {
  if (uHeat < 0.002) { gl_FragColor = vec4(0.0); return; }
  vec2 vb = viewOf(gl_FragCoord.xy);
  float edgeGuard = window(vb.x, 10.0, uView.x - 10.0, 10.0) * window(vb.y, 10.0, uView.y - 10.0, 10.0);
  if (edgeGuard < 0.001) { gl_FragColor = vec4(0.0); return; }

  vec3 r0 = rayOf(vb);
  vec3 V = towardViewer();

  float hullOcc = max(
    hitBox(r0, V, vec3(-98.0, -43.0, 0.0), vec3(95.0, 15.0, 45.0)),
    hitBox(r0, V, vec3(-32.0, -70.0, 18.0), vec3(0.0, -38.0, 70.0))
  );

  vec3 pFloor = onFloor(vb, 0.0);
  float onDeck = window(pFloor.x, -160.0, 160.0, 8.0) * window(pFloor.y, -96.0, 96.0, 8.0);

  float dStbd = length(pFloor.xy - STBD.xy);
  float dPort = length(pFloor.xy - PORT.xy);
  float ringS = (exp(-pow((dStbd - 13.5) / 4.0, 2.0)) * 0.68 + exp(-pow(dStbd / 21.0, 2.0)) * 0.42) * smoothstep(30.0, 36.0, pFloor.y);
  float ringP = (exp(-pow((dPort - 13.5) / 4.0, 2.0)) * 0.62 + exp(-pow(dPort / 20.0, 2.0)) * 0.38) * (1.0 - hullOcc) * smoothstep(-40.0, -46.0, pFloor.y);
  float deckGlow = (ringS + ringP) * onDeck * uHeat;

  float tStack = dot(STACK - r0, V);
  vec3 pS = r0 + tStack * V - STACK;
  float hS = max(pS.z, 0.0);
  float radS = 6.8 + hS * 0.24;
  float dAxis = length(pS.xy - vec2(-hS * 0.22, 0.0));
  float n1 = fbm2(vec2(dAxis * 0.09, hS * 0.07 - uTime * 0.85));
  float vEnv = smoothstep(-2.0, 3.5, pS.z) * exp(-hS / 14.5) * (1.0 - smoothstep(24.0, 36.0, hS));
  float plume = exp(-pow(dAxis / radS, 2.0)) * vEnv * (0.58 + 0.62 * n1) * uHeat;

  float tProp = dot(PROP - r0, V);
  vec3 pW = r0 + tProp * V - PROP;
  float wakeX = max(-pW.x, 0.0);
  float wakeR = length(pW.yz);
  float wakeEnv = smoothstep(-2.0, 3.0, -pW.x) * exp(-wakeX / 15.0) * (1.0 - smoothstep(22.0, 32.0, wakeX));
  float wake = exp(-pow(wakeR / (12.5 + wakeX * 0.16), 2.0)) * wakeEnv * 0.56 * uHeat;

  float dither = (hash12(gl_FragCoord.xy + fract(uTime * 0.61) * 91.0) + hash12(gl_FragCoord.yx * 1.37 + fract(uTime * 0.37) * 57.0) - 1.0) / 255.0;

  vec3 darkLin = (vec3(0.16, 0.86, 0.72) * (deckGlow * 0.88 + wake * 0.68) + vec3(0.42, 0.78, 0.92) * (plume * 0.78)) * edgeGuard;
  vec3 darkCol = tonemap(darkLin, 1.22);
  float aDark = max(darkCol.r, max(darkCol.g, darkCol.b));
  darkCol = max(darkCol + dither * smoothstep(0.0, 1.5 / 255.0, aDark), 0.0);
  aDark = max(darkCol.r, max(darkCol.g, darkCol.b));
  vec4 darkOut = vec4(darkCol, aDark);

  float total = clamp((deckGlow * 0.82 + plume * 0.72 + wake * 0.62) * edgeGuard, 0.0, 1.0);
  float aLight = clamp((1.0 - exp(-1.35 * total)) * 0.62, 0.0, 0.68);
  vec3 lightHue = mix(vec3(0.05, 0.50, 0.43), vec3(0.10, 0.38, 0.54), clamp(plume / (total + 1e-4), 0.0, 1.0));
  vec4 lightOut = vec4(lightHue * aLight, aLight);
  lightOut = max(lightOut + dither * smoothstep(0.0, 1.5 / 255.0, aLight), 0.0);
  lightOut.rgb = min(lightOut.rgb, vec3(lightOut.a));

  gl_FragColor = mix(darkOut, lightOut, uLight);
}
`;

const layer = glLayer({
  canvas,
  fragment: FRAGMENT,
  view: [D.W, D.H],
  camera: D.camera,
  uniforms: ["uHeat", "uLight"],

if (layer) stage.setAttribute("data-gl", "");

// ============================================================================
// 3D WEBGL CAD ENGINE (ORBIT · PAN · ZOOM IN LIGHT & DARK MODE)
// ============================================================================
let renderer3d = null;

function buildRenderer3D() {
  if (renderer3d || !canvas3d) return renderer3d;
  const gl = canvas3d.getContext("webgl2", { antialias: true, alpha: true, premultipliedAlpha: true }) ||
             canvas3d.getContext("webgl", { antialias: true, alpha: true, premultipliedAlpha: true });
  if (!gl) return null;

  const PIVOT = [0, 0, 32];
  const K0 = (D.P.scale || 1) * Math.sqrt(1.6);
  const rad0 = ((D.P.azimuth ?? 38) * Math.PI) / 180;
  const el0 = ((D.P.elevation ?? 29) * Math.PI) / 180;
  const originAtPivot = [
    D.P.origin[0] + (PIVOT[0] * Math.sin(rad0) - PIVOT[1] * Math.cos(rad0)) * K0,
    D.P.origin[1] + ((PIVOT[0] * Math.cos(rad0) + PIVOT[1] * Math.sin(rad0)) * Math.sin(el0) - PIVOT[2] * Math.cos(el0)) * K0,
  ];

  // Tessellate all 3D solids and steam tubes into per-ride batches for instant spring-explode & picking
  const batchesByGroup = new Map();
  const pickMeshes = [];

  function getBatch(pieceId, rideId, moveVec) {
    const key = `${pieceId}|${rideId}`;
    let b = batchesByGroup.get(key);
    if (!b) {
      b = {
        piece: pieceId,
        ride: rideId,
        move: moveVec,
        triPos: [],
        triNorm: [],
        triSmooth: [],
        triTone: [],
        linePos: [],
        lineTone: [],
      };
      batchesByGroup.set(key, b);
    }
    return b;
  }

  function norm3(x, y, z) {
    const l = Math.hypot(x, y, z) || 1;
    return [x / l, y / l, z / l];
  }

  function fPoint(F, s, u, v) {
    return [
      F.o[0] + F.a[0] * s + F.u[0] * u + F.v[0] * v,
      F.o[1] + F.a[1] * s + F.u[1] * u + F.v[1] * v,
      F.o[2] + F.a[2] * s + F.u[2] * u + F.v[2] * v,
    ];
  }

  function fDir(F, sa, uu, vv) {
    return norm3(
      F.a[0] * sa + F.u[0] * uu + F.v[0] * vv,
      F.a[1] * sa + F.u[1] * uu + F.v[1] * vv,
      F.a[2] * sa + F.u[2] * uu + F.v[2] * vv,
    );
  }

  function addTri(batch, pA, pB, pC, nFace, center, toneVal, pickList) {
    const ux = pB[0] - pA[0], uy = pB[1] - pA[1], uz = pB[2] - pA[2];
    const vx = pC[0] - pA[0], vy = pC[1] - pA[1], vz = pC[2] - pA[2];
    const cx = uy * vz - uz * vy, cy = uz * vx - ux * vz, cz = ux * vy - uy * vx;
    if (cx * nFace[0] + cy * nFace[1] + cz * nFace[2] < 0) {
      const tmp = pB; pB = pC; pC = tmp;
    }
    for (const pt of [pA, pB, pC]) {
      batch.triPos.push(pt[0], pt[1], pt[2]);
      batch.triNorm.push(nFace[0], nFace[1], nFace[2]);
      const sn = norm3(pt[0] - center[0], pt[1] - center[1], pt[2] - center[2]);
      batch.triSmooth.push(sn[0], sn[1], sn[2]);
      batch.triTone.push(toneVal);
    }
    if (pickList) pickList.push([pA, pB, pC]);
  }

  function addLine(batch, pA, pB, toneVal) {
    batch.linePos.push(pA[0], pA[1], pA[2], pB[0], pB[1], pB[2]);
    batch.lineTone.push(toneVal, toneVal);
  }

  for (const s of D.solids3d || []) {
    const batch = getBatch(s.p, s.r, s.m);
    const tris = [];
    let minX = 1e9, minY = 1e9, minZ = 1e9, maxX = -1e9, maxY = -1e9, maxZ = -1e9;
    const expand = (pt) => {
      if (pt[0] < minX) minX = pt[0];
      if (pt[1] < minY) minY = pt[1];
      if (pt[2] < minZ) minZ = pt[2];
      if (pt[0] > maxX) maxX = pt[0];
      if (pt[1] > maxY) maxY = pt[1];
      if (pt[2] > maxZ) maxZ = pt[2];
    };

    if (s.k === "b") {
      const F = s.F;
      const poly = s.poly;
      let sMid = 0;
      for (const [sv] of poly) sMid += sv;
      sMid /= poly.length || 1;
      const center = fPoint(F, sMid, 0, 0);
      const N = 24;
      const cosT = Array.from({ length: N }, (_, i) => Math.cos((i / N) * Math.PI * 2));
      const sinT = Array.from({ length: N }, (_, i) => Math.sin((i / N) * Math.PI * 2));

      for (let j = 0; j < poly.length - 1; j++) {
        const [s0, r0] = poly[j];
        const [s1, r1] = poly[j + 1];
        const ds = s1 - s0;
        const dr = r1 - r0;
        const len = Math.hypot(ds, dr);
        if (len < 1e-6) continue;
        const na = -dr / len;
        const nr = ds / len;

        for (let i = 0; i < N; i++) {
          const i1 = (i + 1) % N;
          const p00 = fPoint(F, s0, r0 * cosT[i], r0 * sinT[i]);
          const p01 = fPoint(F, s0, r0 * cosT[i1], r0 * sinT[i1]);
          const p10 = fPoint(F, s1, r1 * cosT[i], r1 * sinT[i]);
          const p11 = fPoint(F, s1, r1 * cosT[i1], r1 * sinT[i1]);
          expand(p00); expand(p11);
          const midC = (cosT[i] + cosT[i1]) * 0.5;
          const midS = (sinT[i] + sinT[i1]) * 0.5;
          const nFace = fDir(F, na, nr * midC, nr * midS);
          if (r0 > 1e-4) addTri(batch, p00, p01, p11, nFace, center, s.t, tris);
          if (r1 > 1e-4) addTri(batch, p00, p11, p10, nFace, center, s.t, tris);
        }

        // Feature ring at sharp profile corners
        if (r1 > 0.4 && j < poly.length - 2) {
          const [s2, r2] = poly[j + 2];
          const ds2 = s2 - s1, dr2 = r2 - r1;
          const l2 = Math.hypot(ds2, dr2) || 1;
          const dotSlope = (ds * ds2 + dr * dr2) / (len * l2);
          if (dotSlope < 0.92) {
            for (let i = 0; i < N; i++) {
              const i1 = (i + 1) % N;
              addLine(
                batch,
                fPoint(F, s1, r1 * cosT[i], r1 * sinT[i]),
                fPoint(F, s1, r1 * cosT[i1], r1 * sinT[i1]),
                s.t,
              );
            }
          }
        }
      }
    } else if (s.k === "p") {
      const F = s.F;
      const poly = s.poly;
      const s0 = s.s0, s1 = s.s1;
      let cx2 = 0, cy2 = 0;
      for (const [px, py] of poly) { cx2 += px; cy2 += py; }
      cx2 /= poly.length || 1;
      cy2 /= poly.length || 1;
      const center = fPoint(F, (s0 + s1) * 0.5, cx2, cy2);
      const nTop = fDir(F, 1, 0, 0);
      const nBot = fDir(F, -1, 0, 0);

      const pTop0 = fPoint(F, s1, poly[0][0], poly[0][1]);
      const pBot0 = fPoint(F, s0, poly[0][0], poly[0][1]);
      expand(pTop0); expand(pBot0);

      for (let i = 1; i < poly.length - 1; i++) {
        const pt1 = fPoint(F, s1, poly[i][0], poly[i][1]);
        const pt2 = fPoint(F, s1, poly[i + 1][0], poly[i + 1][1]);
        const pb1 = fPoint(F, s0, poly[i][0], poly[i][1]);
        const pb2 = fPoint(F, s0, poly[i + 1][0], poly[i + 1][1]);
        expand(pt1); expand(pt2); expand(pb1); expand(pb2);
        addTri(batch, pTop0, pt1, pt2, nTop, center, s.t, tris);
        addTri(batch, pBot0, pb2, pb1, nBot, center, s.t, tris);
      }

      const nCount = poly.length;
      const edgeNorms = [];
      for (let i = 0; i < nCount; i++) {
        const a = poly[i];
        const b = poly[(i + 1) % nCount];
        const dx = b[0] - a[0], dy = b[1] - a[1];
        const len = Math.hypot(dx, dy) || 1;
        let nx = dy / len, ny = -dx / len;
        const mx = (a[0] + b[0]) * 0.5 - cx2;
        const my = (a[1] + b[1]) * 0.5 - cy2;
        if (nx * mx + ny * my < 0) { nx = -nx; ny = -ny; }
        edgeNorms.push([nx, ny]);
      }

      for (let i = 0; i < nCount; i++) {
        const a = poly[i];
        const b = poly[(i + 1) % nCount];
        const [nx, ny] = edgeNorms[i];
        const nWall = fDir(F, 0, nx, ny);
        const a0 = fPoint(F, s0, a[0], a[1]);
        const b0 = fPoint(F, s0, b[0], b[1]);
        const b1 = fPoint(F, s1, b[0], b[1]);
        const a1 = fPoint(F, s1, a[0], a[1]);
        addTri(batch, a0, b0, b1, nWall, center, s.t, tris);
        addTri(batch, a0, b1, a1, nWall, center, s.t, tris);
        addLine(batch, a1, b1, s.t);
        addLine(batch, a0, b0, 0);

        const prevN = edgeNorms[(i - 1 + nCount) % nCount];
        if (prevN[0] * nx + prevN[1] * ny < 0.88) {
          addLine(batch, a0, a1, 0);
        }
      }
    }

    if (tris.length && s.p !== "stand") {
      const bc = [(minX + maxX) * 0.5, (minY + maxY) * 0.5, (minZ + maxZ) * 0.5];
      const br = Math.hypot(maxX - minX, maxY - minY, maxZ - minZ) * 0.55;
      pickMeshes.push({ piece: s.p, ride: s.r, move: s.m, center: bc, radius: br, tris });
    }
  }

  // Tessellate 3D steam tubes
  for (const tb of D.tubes3d || []) {
    const batch = getBatch(tb.p, tb.r, tb.m);
    const pts = tb.pts;
    if (!pts || pts.length < 2) continue;
    const rad = tb.rad || 1.2;
    const N = 14;
    const tris = [];
    let minX = 1e9, minY = 1e9, minZ = 1e9, maxX = -1e9, maxY = -1e9, maxZ = -1e9;
    const expand = (pt) => {
      if (pt[0] < minX) minX = pt[0];
      if (pt[1] < minY) minY = pt[1];
      if (pt[2] < minZ) minZ = pt[2];
      if (pt[0] > maxX) maxX = pt[0];
      if (pt[1] > maxY) maxY = pt[1];
      if (pt[2] > maxZ) maxZ = pt[2];
    };

    const rings = [];
    let prevU = [0, 0, 1];
    for (let k = 0; k < pts.length; k++) {
      const p = pts[k];
      const pPrev = pts[Math.max(0, k - 1)];
      const pNext = pts[Math.min(pts.length - 1, k + 1)];
      const T = norm3(pNext[0] - pPrev[0], pNext[1] - pPrev[1], pNext[2] - pPrev[2]);
      let dotTU = T[0] * prevU[0] + T[1] * prevU[1] + T[2] * prevU[2];
      let ux = prevU[0] - dotTU * T[0], uy = prevU[1] - dotTU * T[1], uz = prevU[2] - dotTU * T[2];
      if (Math.hypot(ux, uy, uz) < 1e-3) {
        const alt = Math.abs(T[2]) < 0.8 ? [0, 0, 1] : [1, 0, 0];
        dotTU = T[0] * alt[0] + T[1] * alt[1] + T[2] * alt[2];
        ux = alt[0] - dotTU * T[0]; uy = alt[1] - dotTU * T[1]; uz = alt[2] - dotTU * T[2];
      }
      const U = norm3(ux, uy, uz);
      prevU = U;
      const V = norm3(T[1] * U[2] - T[2] * U[1], T[2] * U[0] - T[0] * U[2], T[0] * U[1] - T[1] * U[0]);
      const ring = [];
      for (let i = 0; i < N; i++) {
        const ang = (i / N) * Math.PI * 2;
        const ca = Math.cos(ang), sa = Math.sin(ang);
        const nx = U[0] * ca + V[0] * sa;
        const ny = U[1] * ca + V[1] * sa;
        const nz = U[2] * ca + V[2] * sa;
        const vtx = [p[0] + nx * rad, p[1] + ny * rad, p[2] + nz * rad];
        expand(vtx);
        ring.push({ vtx, n: [nx, ny, nz], c: p });
      }
      rings.push(ring);
    }

    for (let k = 0; k < rings.length - 1; k++) {
      const r0 = rings[k];
      const r1 = rings[k + 1];
      const cMid = [
        (pts[k][0] + pts[k + 1][0]) * 0.5,
        (pts[k][1] + pts[k + 1][1]) * 0.5,
        (pts[k][2] + pts[k + 1][2]) * 0.5,
      ];
      for (let i = 0; i < N; i++) {
        const i1 = (i + 1) % N;
        const nFace = norm3(
          r0[i].n[0] + r0[i1].n[0] + r1[i].n[0] + r1[i1].n[0],
          r0[i].n[1] + r0[i1].n[1] + r1[i].n[1] + r1[i1].n[1],
          r0[i].n[2] + r0[i1].n[2] + r1[i].n[2] + r1[i1].n[2],
        );
        addTri(batch, r0[i].vtx, r0[i1].vtx, r1[i1].vtx, nFace, cMid, 1, tris);
        addTri(batch, r0[i].vtx, r1[i1].vtx, r1[i].vtx, nFace, cMid, 1, tris);
      }
    }
    for (const endRing of [rings[0], rings[rings.length - 1]]) {
      for (let i = 0; i < N; i++) {
        addLine(batch, endRing[i].vtx, endRing[(i + 1) % N].vtx, 1);
      }
    }
    if (tris.length) {
      const bc = [(minX + maxX) * 0.5, (minY + maxY) * 0.5, (minZ + maxZ) * 0.5];
      const br = Math.hypot(maxX - minX, maxY - minY, maxZ - minZ) * 0.55;
      pickMeshes.push({ piece: tb.p, ride: tb.r, move: tb.m, center: bc, radius: br, tris });
    }
  }

  for (const ln of D.lines3d || []) {
    const batch = getBatch(ln.p, ln.r, ln.m);
    addLine(batch, ln.a, ln.b, 0);
  }

  // Compile shaders for 3D solid + silhouette + technical lines
  function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    return sh;
  }
  function link(vsSrc, fsSrc) {
    const prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsSrc));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSrc));
    gl.linkProgram(prog);
    return prog;
  }

  const VS_SOLID = `
    attribute vec3 aPos;
    attribute vec3 aNorm;
    attribute vec3 aSmooth;
    attribute float aTone;
    uniform vec3 uOffset;
    uniform vec3 uPivot;
    uniform vec3 uR;
    uniform vec3 uD;
    uniform vec3 uV;
    uniform vec2 uOrigin;
    uniform vec2 uPan;
    uniform vec2 uView;
    uniform float uK;
    uniform float uOutlinePx;
    varying vec3 vNorm;
    varying float vTone;
    void main() {
      vec3 p = aPos + uOffset - uPivot;
      float sx = uOrigin.x + uPan.x + dot(p, uR) * uK;
      float sy = uOrigin.y + uPan.y + dot(p, uD) * uK;
      if (uOutlinePx > 0.0) {
        vec2 n2 = vec2(dot(aSmooth, uR), dot(aSmooth, uD));
        float nl = length(n2);
        if (nl > 1e-4) {
          sx += (n2.x / nl) * uOutlinePx;
          sy += (n2.y / nl) * uOutlinePx;
        }
      }
      float ndcX = (sx / uView.x) * 2.0 - 1.0;
      float ndcY = 1.0 - (sy / uView.y) * 2.0;
      float ndcZ = -dot(p, uV) / 340.0 + (uOutlinePx > 0.0 ? 0.0018 : 0.0);
      gl_Position = vec4(ndcX, ndcY, clamp(ndcZ, -0.99, 0.99), 1.0);
      vNorm = aNorm;
      vTone = aTone;
    }
  `;

  const FS_SOLID = `
    precision highp float;
    varying vec3 vNorm;
    varying float vTone;
    uniform vec3 uLightDir;
    uniform float uIsOutline;
    uniform float uState; // 0 = normal, 1 = selected/lit, -1 = dimmed
    uniform vec3 uTopCol;
    uniform vec3 uShade0;
    uniform vec3 uShade1;
    uniform vec3 uShade2;
    uniform vec3 uShade3;
    uniform vec3 uLitTop;
    uniform vec3 uLitShade;
    uniform vec3 uEdgeHi;
    uniform vec3 uEdgeMid;
    uniform vec3 uEdgeLo;
    uniform vec3 uEdgeLit;
    void main() {
      if (uIsOutline > 0.5) {
        vec3 ec = uState > 0.5 ? uEdgeLit : (uState < -0.5 ? uEdgeLo : (vTone > 1.5 ? uEdgeHi : (vTone > 0.5 ? uEdgeMid : uEdgeLo)));
        gl_FragColor = vec4(ec, 1.0);
        return;
      }
      vec3 n = normalize(vNorm);
      if (n.z > 0.72) {
        vec3 tc = uState > 0.5 ? uLitTop : uTopCol;
        gl_FragColor = vec4(tc, 1.0);
        return;
      }
      float nl = clamp((dot(n, uLightDir) + 1.0) * 0.5, 0.0, 0.999);
      vec3 sc = nl < 0.25 ? uShade0 : (nl < 0.50 ? uShade1 : (nl < 0.75 ? uShade2 : uShade3));
      if (uState > 0.5) sc = mix(sc, uLitShade, 0.65);
      else if (uState < -0.5) sc = mix(sc, uShade0, 0.45);
      gl_FragColor = vec4(sc, 1.0);
    }
  `;

  const VS_LINE = `
    attribute vec3 aPos;
    attribute float aTone;
    uniform vec3 uOffset;
    uniform vec3 uPivot;
    uniform vec3 uR;
    uniform vec3 uD;
    uniform vec3 uV;
    uniform vec2 uOrigin;
    uniform vec2 uPan;
    uniform vec2 uView;
    uniform float uK;
    varying float vTone;
    void main() {
      vec3 p = aPos + uOffset - uPivot;
      float sx = uOrigin.x + uPan.x + dot(p, uR) * uK;
      float sy = uOrigin.y + uPan.y + dot(p, uD) * uK;
      float ndcX = (sx / uView.x) * 2.0 - 1.0;
      float ndcY = 1.0 - (sy / uView.y) * 2.0;
      float ndcZ = -dot(p, uV) / 340.0 - 0.0012;
      gl_Position = vec4(ndcX, ndcY, clamp(ndcZ, -0.99, 0.99), 1.0);
      vTone = aTone;
    }
  `;

  const FS_LINE = `
    precision highp float;
    varying float vTone;
    uniform float uState;
    uniform vec3 uEdgeHi;
    uniform vec3 uEdgeMid;
    uniform vec3 uEdgeLo;
    uniform vec3 uEdgeLit;
    void main() {
      vec3 c = uState > 0.5 ? uEdgeLit : (uState < -0.5 ? uEdgeLo : (vTone > 1.5 ? uEdgeHi : (vTone > 0.5 ? uEdgeMid : uEdgeLo)));
      gl_FragColor = vec4(c, 1.0);
    }
  `;

  const solidProg = link(VS_SOLID, FS_SOLID);
  const lineProg = link(VS_LINE, FS_LINE);

  const gpuBatches = [];
  for (const b of batchesByGroup.values()) {
    const triCount = b.triTone.length;
    const lineCount = b.lineTone.length;
    const gb = { piece: b.piece, ride: b.ride, move: b.move, triCount, lineCount };
    if (triCount > 0) {
      gb.posBuf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, gb.posBuf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(b.triPos), gl.STATIC_DRAW);

      gb.normBuf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, gb.normBuf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(b.triNorm), gl.STATIC_DRAW);

      gb.smoothBuf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, gb.smoothBuf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(b.triSmooth), gl.STATIC_DRAW);

      gb.toneBuf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, gb.toneBuf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(b.triTone), gl.STATIC_DRAW);
    }
    if (lineCount > 0) {
      gb.lPosBuf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, gb.lPosBuf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(b.linePos), gl.STATIC_DRAW);

      gb.lToneBuf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, gb.lToneBuf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(b.lineTone), gl.STATIC_DRAW);
    }
    gpuBatches.push(gb);
  }

  // Dynamic buffer for the live 3D Bourdon gauge needle
  const needlePosBuf = gl.createBuffer();
  const needleToneBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, needleToneBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([2, 2]), gl.STATIC_DRAW);

  function basisOf() {
    const a = (cam.az * Math.PI) / 180;
    const e = (cam.el * Math.PI) / 180;
    const sinA = Math.sin(a), cosA = Math.cos(a);
    const sinE = Math.sin(e), cosE = Math.cos(e);
    return {
      R: [sinA, -cosA, 0],
      D: [cosA * sinE, sinA * sinE, -cosE],
      V: [cosA * cosE, sinA * cosE, sinE],
      L: norm3(-sinA, cosA, 0.25),
      k: K0 * cam.zoom,
    };
  }

  function paletteOf() {
    if (isLight) {
      return {
        top: [1.0, 1.0, 1.0],
        s0: [0.863, 0.863, 0.851],
        s1: [0.898, 0.898, 0.886],
        s2: [0.929, 0.929, 0.918],
        s3: [0.957, 0.957, 0.945],
        litTop: [1.0, 1.0, 1.0],
        litShade: [0.933, 0.933, 0.922],
        hi: [0.149, 0.149, 0.165],
        mid: [0.541, 0.541, 0.561],
        lo: [0.706, 0.706, 0.722],
        lit: [0.0, 0.0, 0.0],
      };
    }
    return {
      top: [0.110, 0.110, 0.110],
      s0: [0.059, 0.059, 0.059],
      s1: [0.071, 0.071, 0.071],
      s2: [0.082, 0.082, 0.082],
      s3: [0.094, 0.094, 0.094],
      litTop: [0.165, 0.165, 0.165],
      litShade: [0.125, 0.125, 0.125],
      hi: [0.831, 0.831, 0.831],
      mid: [0.416, 0.416, 0.416],
      lo: [0.243, 0.243, 0.243],
      lit: [1.0, 1.0, 1.0],
    };
  }

  function stateForPiece(p) {
    if (!selected) return 0;
    if (p === "stand") return -1;
    const match =
      p === selected ||
      (selected === "sponsons" && p === "portsponson") ||
      (selected === "propulsion" && p === "sternscrew");
    return match ? 1 : -1;
  }

  function draw() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas3d.getBoundingClientRect();
    const w = Math.max(1, Math.round((rect.width || D.W) * dpr));
    const h = Math.max(1, Math.round((rect.height || D.H) * dpr));
    if (canvas3d.width !== w || canvas3d.height !== h) {
      canvas3d.width = w;
      canvas3d.height = h;
    }
    gl.viewport(0, 0, w, h);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);

    const { R, D: Dvec, V, L, k } = basisOf();
    const pal = paletteOf();

    gl.useProgram(solidProg);
    const uOffset = gl.getUniformLocation(solidProg, "uOffset");
    const uPivot = gl.getUniformLocation(solidProg, "uPivot");
    const uR = gl.getUniformLocation(solidProg, "uR");
    const uD = gl.getUniformLocation(solidProg, "uD");
    const uV = gl.getUniformLocation(solidProg, "uV");
    const uOrigin = gl.getUniformLocation(solidProg, "uOrigin");
    const uPan = gl.getUniformLocation(solidProg, "uPan");
    const uView = gl.getUniformLocation(solidProg, "uView");
    const uK = gl.getUniformLocation(solidProg, "uK");
    const uOutlinePx = gl.getUniformLocation(solidProg, "uOutlinePx");
    const uLightDir = gl.getUniformLocation(solidProg, "uLightDir");
    const uIsOutline = gl.getUniformLocation(solidProg, "uIsOutline");
    const uState = gl.getUniformLocation(solidProg, "uState");

    gl.uniform3fv(uPivot, PIVOT);
    gl.uniform3fv(uR, R);
    gl.uniform3fv(uD, Dvec);
    gl.uniform3fv(uV, V);
    gl.uniform2fv(uOrigin, originAtPivot);
    gl.uniform2f(uPan, cam.panX, cam.panY);
    gl.uniform2f(uView, D.W, D.H);
    gl.uniform1f(uK, k);
    gl.uniform3fv(uLightDir, L);
    gl.uniform3fv(gl.getUniformLocation(solidProg, "uTopCol"), pal.top);
    gl.uniform3fv(gl.getUniformLocation(solidProg, "uShade0"), pal.s0);
    gl.uniform3fv(gl.getUniformLocation(solidProg, "uShade1"), pal.s1);
    gl.uniform3fv(gl.getUniformLocation(solidProg, "uShade2"), pal.s2);
    gl.uniform3fv(gl.getUniformLocation(solidProg, "uShade3"), pal.s3);
    gl.uniform3fv(gl.getUniformLocation(solidProg, "uLitTop"), pal.litTop);
    gl.uniform3fv(gl.getUniformLocation(solidProg, "uLitShade"), pal.litShade);
    gl.uniform3fv(gl.getUniformLocation(solidProg, "uEdgeHi"), pal.hi);
    gl.uniform3fv(gl.getUniformLocation(solidProg, "uEdgeMid"), pal.mid);
    gl.uniform3fv(gl.getUniformLocation(solidProg, "uEdgeLo"), pal.lo);
    gl.uniform3fv(gl.getUniformLocation(solidProg, "uEdgeLit"), pal.lit);

    const aPos = gl.getAttribLocation(solidProg, "aPos");
    const aNorm = gl.getAttribLocation(solidProg, "aNorm");
    const aSmooth = gl.getAttribLocation(solidProg, "aSmooth");
    const aTone = gl.getAttribLocation(solidProg, "aTone");
    gl.enableVertexAttribArray(aPos);
    gl.enableVertexAttribArray(aNorm);
    gl.enableVertexAttribArray(aSmooth);
    gl.enableVertexAttribArray(aTone);

    // Pass 1 & 2: Silhouette outlines (front-face culled) + 4-tone shaded faces (back-face culled)
    // Note: R x (-D) = -V, so 3D CCW triangles with dot(n, V) > 0 project to CW in NDC.
    gl.enable(gl.CULL_FACE);
    gl.frontFace(gl.CW);

    for (const pass of [0, 1]) {
      if (pass === 0) {
        gl.cullFace(gl.FRONT);
        gl.disable(gl.POLYGON_OFFSET_FILL);
        gl.uniform1f(uIsOutline, 1.0);
        gl.uniform1f(uOutlinePx, 1.15);
      } else {
        gl.cullFace(gl.BACK);
        gl.enable(gl.POLYGON_OFFSET_FILL);
        gl.polygonOffset(1.2, 1.2);
        gl.uniform1f(uIsOutline, 0.0);
        gl.uniform1f(uOutlinePx, 0.0);
      }
      for (const gb of gpuBatches) {
        if (!gb.triCount) continue;
        const share = piece[gb.ride]?.x ?? 0;
        gl.uniform3f(uOffset, gb.move[0] * share, gb.move[1] * share, gb.move[2] * share);
        gl.uniform1f(uState, stateForPiece(gb.piece));

        gl.bindBuffer(gl.ARRAY_BUFFER, gb.posBuf);
        gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);
        gl.bindBuffer(gl.ARRAY_BUFFER, gb.normBuf);
        gl.vertexAttribPointer(aNorm, 3, gl.FLOAT, false, 0, 0);
        gl.bindBuffer(gl.ARRAY_BUFFER, gb.smoothBuf);
        gl.vertexAttribPointer(aSmooth, 3, gl.FLOAT, false, 0, 0);
        gl.bindBuffer(gl.ARRAY_BUFFER, gb.toneBuf);
        gl.vertexAttribPointer(aTone, 1, gl.FLOAT, false, 0, 0);

        gl.drawArrays(gl.TRIANGLES, 0, gb.triCount);
      }
    }

    gl.disable(gl.CULL_FACE);
    gl.disable(gl.POLYGON_OFFSET_FILL);
    gl.disableVertexAttribArray(aNorm);
    gl.disableVertexAttribArray(aSmooth);

    // Pass 3: Technical crease, rim, ruler, deck plank & gauge needle lines
    gl.useProgram(lineProg);
    const lOffset = gl.getUniformLocation(lineProg, "uOffset");
    const lState = gl.getUniformLocation(lineProg, "uState");
    gl.uniform3fv(gl.getUniformLocation(lineProg, "uPivot"), PIVOT);
    gl.uniform3fv(gl.getUniformLocation(lineProg, "uR"), R);
    gl.uniform3fv(gl.getUniformLocation(lineProg, "uD"), Dvec);
    gl.uniform3fv(gl.getUniformLocation(lineProg, "uV"), V);
    gl.uniform2fv(gl.getUniformLocation(lineProg, "uOrigin"), originAtPivot);
    gl.uniform2f(gl.getUniformLocation(lineProg, "uPan"), cam.panX, cam.panY);
    gl.uniform2f(gl.getUniformLocation(lineProg, "uView"), D.W, D.H);
    gl.uniform1f(gl.getUniformLocation(lineProg, "uK"), k);
    gl.uniform3fv(gl.getUniformLocation(lineProg, "uEdgeHi"), pal.hi);
    gl.uniform3fv(gl.getUniformLocation(lineProg, "uEdgeMid"), pal.mid);
    gl.uniform3fv(gl.getUniformLocation(lineProg, "uEdgeLo"), pal.lo);
    gl.uniform3fv(gl.getUniformLocation(lineProg, "uEdgeLit"), pal.lit);

    const lPos = gl.getAttribLocation(lineProg, "aPos");
    const lTone = gl.getAttribLocation(lineProg, "aTone");
    gl.enableVertexAttribArray(lPos);
    gl.enableVertexAttribArray(lTone);

    for (const gb of gpuBatches) {
      if (!gb.lineCount) continue;
      const share = piece[gb.ride]?.x ?? 0;
      gl.uniform3f(lOffset, gb.move[0] * share, gb.move[1] * share, gb.move[2] * share);
      gl.uniform1f(lState, stateForPiece(gb.piece));

      gl.bindBuffer(gl.ARRAY_BUFFER, gb.lPosBuf);
      gl.vertexAttribPointer(lPos, 3, gl.FLOAT, false, 0, 0);
      gl.bindBuffer(gl.ARRAY_BUFFER, gb.lToneBuf);
      gl.vertexAttribPointer(lTone, 1, gl.FLOAT, false, 0, 0);
      gl.drawArrays(gl.LINES, 0, gb.lineCount);
    }

    // Live Bourdon gauge needle in 3D
    const ang = gaugeTurn.x * Math.PI * 2;
    const [dx, dy] = D.dial;
    const dr = D.dialR;
    const nz = D.dialTop + 0.25;
    const needleVerts = new Float32Array([
      dx - Math.sin(ang) * 2.6, dy + Math.cos(ang) * 2.6, nz,
      dx + Math.sin(ang) * (dr - 3.2), dy - Math.cos(ang) * (dr - 3.2), nz,
    ]);
    gl.uniform3f(lOffset, 0, 0, 0);
    gl.uniform1f(lState, 1.0);
    gl.bindBuffer(gl.ARRAY_BUFFER, needlePosBuf);
    gl.bufferData(gl.ARRAY_BUFFER, needleVerts, gl.DYNAMIC_DRAW);
    gl.vertexAttribPointer(lPos, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, needleToneBuf);
    gl.vertexAttribPointer(lTone, 1, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.LINES, 0, 2);

    // Live 3D Aether-Steam Levitation Rings & Funnel Plume when stoked
    if (heat.x > 0.05) {
      const aetherVerts = [];
      const aetherTones = [];
      const segs = 24;
      const pushRing3d = (cx, cy, cz, rx, ry, axis = "z") => {
        for (let i = 0; i < segs; i++) {
          const a0 = (i / segs) * Math.PI * 2;
          const a1 = ((i + 1) / segs) * Math.PI * 2;
          if (axis === "z") {
            aetherVerts.push(cx + Math.cos(a0) * rx, cy + Math.sin(a0) * ry, cz);
            aetherVerts.push(cx + Math.cos(a1) * rx, cy + Math.sin(a1) * ry, cz);
          } else {
            aetherVerts.push(cx, cy + Math.cos(a0) * rx, cz + Math.sin(a0) * ry);
            aetherVerts.push(cx, cy + Math.cos(a1) * rx, cz + Math.sin(a1) * ry);
          }
          aetherTones.push(2, 2);
        }
      };
      const pulse = (clock * 0.9) % 1;
      for (const [cx, cy] of [[D.stbdCoil[0], D.stbdCoil[1]], [D.portCoil[0], D.portCoil[1]]]) {
        pushRing3d(cx, cy, 0.35, 11.5, 11.5, "z");
        pushRing3d(cx, cy, 0.35, 15.0 + pulse * 3.5, 15.0 + pulse * 3.5, "z");
      }
      const bShare = piece.boiler?.x ?? 0;
      const sx = D.stackTop[0] + (D.pieces.boiler ? 0 : 0);
      const sy = D.stackTop[1];
      const sz = D.stackTop[2] + 48 * bShare;
      for (let kRing = 0; kRing < 3; kRing++) {
        const hOff = ((clock * 1.2 + kRing * 0.33) % 1) * 18;
        const rPlume = 5.0 + hOff * 0.28;
        pushRing3d(sx - hOff * 0.18, sy, sz + 2 + hOff, rPlume, rPlume, "z");
      }
      const pShare = piece.sternscrew?.x ?? 0;
      const px = D.propExit[0] - 44 * pShare;
      pushRing3d(px - 3 - pulse * 10, D.propExit[1], D.propExit[2], 8.5 + pulse * 3.0, 8.5 + pulse * 3.0, "x");

      const aetherCol = isLight ? [0.05, 0.65, 0.47] : [0.22, 0.85, 0.66];
      gl.uniform3fv(gl.getUniformLocation(lineProg, "uEdgeLit"), aetherCol);
      gl.uniform3f(lOffset, 0, 0, 0);
      gl.uniform1f(lState, 1.0);

      gl.bindBuffer(gl.ARRAY_BUFFER, needlePosBuf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(aetherVerts), gl.DYNAMIC_DRAW);
      gl.vertexAttribPointer(lPos, 3, gl.FLOAT, false, 0, 0);

      gl.bindBuffer(gl.ARRAY_BUFFER, needleToneBuf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(aetherTones), gl.DYNAMIC_DRAW);
      gl.vertexAttribPointer(lTone, 1, gl.FLOAT, false, 0, 0);
      gl.drawArrays(gl.LINES, 0, aetherTones.length);

      // Restore needleToneBuf size 2 for next frame
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([2, 2]), gl.STATIC_DRAW);
    }
  }

  function pickAt(clientX, clientY) {
    const rect = stage.getBoundingClientRect();
    if (!rect.width || !rect.height) return null;
    const vx = ((clientX - rect.left) / rect.width) * D.W;
    const vy = ((clientY - rect.top) / rect.height) * D.H;
    const { R, D: Dvec, V, k } = basisOf();
    const rx = (vx - originAtPivot[0] - cam.panX) / k;
    const ry = (vy - originAtPivot[1] - cam.panY) / k;

    let bestPiece = null;
    let bestZ = -1e9;

    for (const pm of pickMeshes) {
      const share = piece[pm.ride]?.x ?? 0;
      const ox = pm.move[0] * share - PIVOT[0];
      const oy = pm.move[1] * share - PIVOT[1];
      const oz = pm.move[2] * share - PIVOT[2];
      const cx = pm.center[0] + ox;
      const cy = pm.center[1] + oy;
      const cz = pm.center[2] + oz;
      const sx = cx * R[0] + cy * R[1] + cz * R[2];
      const sy = cx * Dvec[0] + cy * Dvec[1] + cz * Dvec[2];
      if ((rx - sx) * (rx - sx) + (ry - sy) * (ry - sy) > pm.radius * pm.radius) continue;

      for (const [A, B, C] of pm.tris) {
        const ax = (A[0] + ox) * R[0] + (A[1] + oy) * R[1] + (A[2] + oz) * R[2];
        const ay = (A[0] + ox) * Dvec[0] + (A[1] + oy) * Dvec[1] + (A[2] + oz) * Dvec[2];
        const bx = (B[0] + ox) * R[0] + (B[1] + oy) * R[1] + (B[2] + oz) * R[2];
        const by = (B[0] + ox) * Dvec[0] + (B[1] + oy) * Dvec[1] + (B[2] + oz) * Dvec[2];
        const cx2 = (C[0] + ox) * R[0] + (C[1] + oy) * R[1] + (C[2] + oz) * R[2];
        const cy2 = (C[0] + ox) * Dvec[0] + (C[1] + oy) * Dvec[1] + (C[2] + oz) * Dvec[2];

        const v0x = cx2 - ax, v0y = cy2 - ay;
        const v1x = bx - ax, v1y = by - ay;
        const v2x = rx - ax, v2y = ry - ay;
        const denom = v0x * v1y - v1x * v0y;
        if (Math.abs(denom) < 1e-6) continue;
        const inv = 1 / denom;
        const u = (v2x * v1y - v1x * v2y) * inv;
        if (u < 0 || u > 1) continue;
        const v = (v0x * v2y - v2x * v0y) * inv;
        if (v < 0 || u + v > 1) continue;

        const az = (A[0] + ox) * V[0] + (A[1] + oy) * V[1] + (A[2] + oz) * V[2];
        const bz = (B[0] + ox) * V[0] + (B[1] + oy) * V[1] + (B[2] + oz) * V[2];
        const cz2 = (C[0] + ox) * V[0] + (C[1] + oy) * V[1] + (C[2] + oz) * V[2];
        const z = az * (1 - u - v) + bz * v + cz2 * u;
        if (z > bestZ) {
          bestZ = z;
          bestPiece = pm.piece;
        }
      }
    }
    return bestPiece;
  }

  renderer3d = { draw, pickAt };
  return renderer3d;
}

function syncModeUI() {
  if (mode3d) {
    stage.setAttribute("data-mode", "3d");
    if (modeBtnTop) modeBtnTop.setAttribute("data-on", "");
    if (modeBtnPill) modeBtnPill.setAttribute("data-on", "");
    if (modeLabelTop) modeLabelTop.textContent = "2D Blueprint";
    if (modeLabelPill) modeLabelPill.textContent = "3D Pan & Zoom";
    buildRenderer3D();
  } else {
    stage.removeAttribute("data-mode");
    if (modeBtnTop) modeBtnTop.removeAttribute("data-on");
    if (modeBtnPill) modeBtnPill.removeAttribute("data-on");
    if (modeLabelTop) modeLabelTop.textContent = "3D Pan & Zoom";
    if (modeLabelPill) modeLabelPill.textContent = "3D Pan & Zoom";
  }
  updateHint();
  updateReadout();
  run();
}

function setMode3d(on) {
  mode3d = Boolean(on);
  syncModeUI();
}

function resetCamera() {
  cam.targetAz = HOME_AZ;
  cam.targetEl = HOME_EL;
  cam.targetPanX = 0;
  cam.targetPanY = 0;
  cam.targetZoom = 1;
  run();
}

function stepCamera(dt, calm) {
  const rate = calm ? 1 : Math.min(1, dt * 16);
  let moving = false;
  const stepVal = (key, tKey, eps = 1e-3) => {
    const diff = cam[tKey] - cam[key];
    if (Math.abs(diff) > eps) {
      cam[key] += diff * rate;
      moving = true;
    } else if (diff !== 0) {
      cam[key] = cam[tKey];
    }
  };
  stepVal("az", "targetAz", 0.02);
  stepVal("el", "targetEl", 0.02);
  stepVal("panX", "targetPanX", 0.08);
  stepVal("panY", "targetPanY", 0.08);
  stepVal("zoom", "targetZoom", 0.001);
  if (zoomReadoutBtn) {
    const pct = `${Math.round(cam.zoom * 100)}%`;
    if (zoomReadoutBtn.textContent !== pct) zoomReadoutBtn.textContent = pct;
  }
  return moving;
}

function run() {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
}

function setStoked(on) {
  stoked = on;
  if (stoked) {
    fireButton.setAttribute("data-on", "");
    fireLabel.textContent = "Aether Stoked";
  } else {
    fireButton.removeAttribute("data-on");
    fireLabel.textContent = "Stoke Aether";
  }
  run();
}
setStoked(true);
syncThemeUI();

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  clock += dt;
  const calm = still.matches;

  let moving = stepCamera(dt, calm);
  for (const id of IDS) {
    if (steerSpring(piece[id], dt, calm)) moving = true;
  }
  const wantHeat = apart && !mode3d ? 0.0 : stoked ? 1.0 : 0.12;
  if (settle(heat, wantHeat, dt, apart ? 0.12 : 0.36, calm)) moving = true;
  const wantTurn = 0.12 + 0.72 * (stoked ? 1.0 : 0.12);
  if (settle(gaugeTurn, wantTurn, dt, 0.32, calm)) moving = true;

  place();
  updateReadout();

  if (mode3d) {
    const r3 = buildRenderer3D();
    if (r3) r3.draw();
  } else if (layer) {
    if (heat.x > 0.005) layer.draw({ uHeat: heat.x, uLight: isLight ? 1 : 0 }, calm ? 1.0 : clock);
    else layer.clear();
  }

  const activeGl = !mode3d && layer && stoked && !calm;
  frame = visible && (moving || activeGl) ? requestAnimationFrame(tick) : 0;
}

new IntersectionObserver(
  (entries) => {
    visible = entries[entries.length - 1].isIntersecting;
    if (visible) run();
  },
  { rootMargin: "120px 0px" },
).observe(stage);

// ============================================================================
// MOUSE & TOUCH CONTROLS (3D ORBIT, PAN, ZOOM & PART SELECTION)
// ============================================================================
let inside = false;
const pointers = new Map();
let dragState = null;

stage.addEventListener("contextmenu", (e) => {
  if (mode3d || cam.zoom > 1.01) e.preventDefault();
});

stage.addEventListener("pointerdown", (e) => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  stage.setPointerCapture?.(e.pointerId);

  const isPanGesture =
    e.button === 2 ||
    e.button === 1 ||
    e.shiftKey ||
    dragTool === "pan" ||
    pointers.size >= 2;

  if (pointers.size === 2) {
    const pts = [...pointers.values()];
    dragState = {
      kind: "pinch",
      dist0: Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y) || 1,
      zoom0: cam.targetZoom,
      midX: (pts[0].x + pts[1].x) * 0.5,
      midY: (pts[0].y + pts[1].y) * 0.5,
      panX0: cam.targetPanX,
      panY0: cam.targetPanY,
      moved: 10,
    };
    return;
  }

  dragState = {
    kind: isPanGesture ? "pan" : "orbit",
    x0: e.clientX,
    y0: e.clientY,
    az0: cam.targetAz,
    el0: cam.targetEl,
    panX0: cam.targetPanX,
    panY0: cam.targetPanY,
    moved: 0,
  };
});

stage.addEventListener("pointermove", (e) => {
  inside = true;
  clearTimeout(leaveTimer);

  if (pointers.has(e.pointerId)) {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  }

  if (dragState) {
    if (dragState.kind === "pinch" && pointers.size >= 2) {
      const pts = [...pointers.values()];
      const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y) || 1;
      const midX = (pts[0].x + pts[1].x) * 0.5;
      const midY = (pts[0].y + pts[1].y) * 0.5;
      const rect = stage.getBoundingClientRect();
      const sx = D.W / (rect.width || D.W);
      const sy = D.H / (rect.height || D.H);
      cam.targetZoom = Math.max(0.45, Math.min(4.5, dragState.zoom0 * (dist / dragState.dist0)));
      cam.targetPanX = dragState.panX0 + (midX - dragState.midX) * sx;
      cam.targetPanY = dragState.panY0 + (midY - dragState.midY) * sy;
      run();
      return;
    }

    const dx = e.clientX - dragState.x0;
    const dy = e.clientY - dragState.y0;
    dragState.moved = Math.max(dragState.moved, Math.hypot(dx, dy));

    if (dragState.moved > 4) {
      const rect = stage.getBoundingClientRect();
      const sx = D.W / (rect.width || D.W);
      const sy = D.H / (rect.height || D.H);
      if (dragState.kind === "pan") {
        cam.targetPanX = Math.max(-420, Math.min(420, dragState.panX0 + dx * sx));
        cam.targetPanY = Math.max(-320, Math.min(320, dragState.panY0 + dy * sy));
      } else {
        if (!mode3d) setMode3d(true);
        cam.targetAz = dragState.az0 - dx * 0.45;
        cam.targetEl = Math.max(6, Math.min(84, dragState.el0 + dy * 0.35));
      }
      run();
      return;
    }
  }

  // Hover inspection when not dragging
  if (mode3d) {
    if (!pinned && renderer3d) {
      const hitPiece = renderer3d.pickAt(e.clientX, e.clientY);
      select(hitPiece);
    }
    return;
  }

  const hit = e.target.closest(".it");
  setApart(true);
  if (!pinned) {
    select(hit ? hit.dataset.piece : null);
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (dragState && pointers.size === 0) {
    const wasClick = dragState.moved <= 5 && e.type === "pointerup" && e.button === 0;
    dragState = null;
    if (wasClick) {
      if (mode3d && renderer3d) {
        const hitPiece = renderer3d.pickAt(e.clientX, e.clientY);
        togglePin(hitPiece);
      } else {
        const hit = e.target.closest(".it");
        togglePin(hit ? hit.dataset.piece : null);
      }
    }
  }
}

stage.addEventListener("pointerup", endPointer);
stage.addEventListener("pointercancel", endPointer);

stage.addEventListener("dblclick", (e) => {
  e.preventDefault();
  resetCamera();
});

stage.addEventListener(
  "wheel",
  (e) => {
    e.preventDefault();
    const rect = stage.getBoundingClientRect();
    const vx = ((e.clientX - rect.left) / (rect.width || 1)) * D.W - D.W * 0.5;
    const vy = ((e.clientY - rect.top) / (rect.height || 1)) * D.H - D.H * 0.5;
    const factor = Math.exp(-e.deltaY * 0.0014);
    const nextZoom = Math.max(0.45, Math.min(4.5, cam.targetZoom * factor));
    const ratio = nextZoom / cam.targetZoom;
    cam.targetPanX = Math.max(-420, Math.min(420, vx - (vx - cam.targetPanX) * ratio));
    cam.targetPanY = Math.max(-320, Math.min(320, vy - (vy - cam.targetPanY) * ratio));
    cam.targetZoom = nextZoom;
    run();
  },
  { passive: false },
);

stage.addEventListener("pointerleave", () => {
  inside = false;
  clearTimeout(leaveTimer);
  leaveTimer = setTimeout(() => {
    if (inside || pinned || mode3d || partButtons.some((other) => other.matches(":hover, :focus-visible"))) return;
    select(null);
    setApart(false);
  }, 220);
});

partButtons.forEach((button) => {
  const preview = () => {
    clearTimeout(leaveTimer);
    if (pinned) return;
    if (!mode3d) setApart(true);
    select(button.dataset.part);
    run();
  };
  const hide = () => {
    clearTimeout(leaveTimer);
    leaveTimer = setTimeout(() => {
      if (inside || pinned || partButtons.some((other) => other.matches(":hover, :focus-visible"))) return;
      select(null);
      if (!mode3d) setApart(false);
    }, 220);
  };
  button.addEventListener("pointerenter", preview);
  button.addEventListener("focus", preview);
  button.addEventListener("pointerleave", hide);
  button.addEventListener("blur", hide);
  button.addEventListener("click", () => {
    clearTimeout(leaveTimer);
    togglePin(button.dataset.part);
  });
});

fireButton.addEventListener("click", () => setStoked(!stoked));
if (modeBtnTop) modeBtnTop.addEventListener("click", () => setMode3d(!mode3d));
if (modeBtnPill) modeBtnPill.addEventListener("click", () => setMode3d(!mode3d));
if (themeBtnTop) themeBtnTop.addEventListener("click", () => setTheme(!isLight));
if (themeBtnPill) themeBtnPill.addEventListener("click", () => setTheme(!isLight));
if (dragOrbitBtn) {
  dragOrbitBtn.addEventListener("click", () => {
    setDragTool("orbit");
    if (!mode3d) setMode3d(true);
  });
}
if (dragPanBtn) {
  dragPanBtn.addEventListener("click", () => {
    setDragTool("pan");
  });
}
if (zoomInBtn) {
  zoomInBtn.addEventListener("click", () => {
    cam.targetZoom = Math.min(4.5, cam.targetZoom * 1.25);
    run();
  });
}
if (zoomOutBtn) {
  zoomOutBtn.addEventListener("click", () => {
    cam.targetZoom = Math.max(0.45, cam.targetZoom / 1.25);
    run();
  });
}
if (zoomReadoutBtn) {
  zoomReadoutBtn.addEventListener("click", () => resetCamera());
}
if (explodeBtn) {
  explodeBtn.addEventListener("click", () => {
    setApart(!apart);
    if (!apart) {
      pinned = null;
      select(null);
    }
  });
}
if (resetBtn) {
  resetBtn.addEventListener("click", () => {
    pinned = null;
    select(null);
    setApart(false);
    resetCamera();
  });
}

stage.addEventListener("keydown", (event) => {
  if (event.key === "i" || event.key === "I" || event.key === "Enter") {
    event.preventDefault();
    setStoked(!stoked);
    return;
  }
  if (event.key === "v" || event.key === "V") {
    event.preventDefault();
    setMode3d(!mode3d);
    return;
  }
  if (event.key === "t" || event.key === "T") {
    event.preventDefault();
    setTheme(!isLight);
    return;
  }
  if (event.key === "=" || event.key === "+") {
    event.preventDefault();
    cam.targetZoom = Math.min(4.5, cam.targetZoom * 1.2);
    run();
    return;
  }
  if (event.key === "-" || event.key === "_") {
    event.preventDefault();
    cam.targetZoom = Math.max(0.45, cam.targetZoom / 1.2);
    run();
    return;
  }
  if (event.key === "0") {
    event.preventDefault();
    pinned = null;
    select(null);
    setApart(false);
    resetCamera();
    return;
  }
  if (event.key >= "1" && event.key <= "8") {
    event.preventDefault();
    const id = D.order[Number(event.key) - 1];
    if (id) togglePin(id);
    return;
  }
  if (event.key === " ") {
    event.preventDefault();
    setApart(!apart);
    if (!apart) {
      pinned = null;
      select(null);
    }
    run();
    return;
  }
  if (event.key === "Escape") {
    event.preventDefault();
    pinned = null;
    select(null);
    setApart(false);
    resetCamera();
    return;
  }
  const index = selected ? D.order.indexOf(selected) : -1;
  if (event.key === "ArrowRight" || event.key === "ArrowDown") {
    event.preventDefault();
    setApart(true);
    const nextId = D.order[(index + 1) % D.order.length];
    pinned = nextId;
    select(nextId);
  } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
    event.preventDefault();
    setApart(true);
    const prevId = D.order[(index - 1 + D.order.length) % D.order.length];
    pinned = prevId;
    select(prevId);
  } else if (event.key === "Home") {
    event.preventDefault();
    setApart(true);
    pinned = D.order[0];
    select(D.order[0]);
  } else if (event.key === "End") {
    event.preventDefault();
    setApart(true);
    pinned = D.order[D.order.length - 1];
    select(D.order[D.order.length - 1]);
  }
});

updateHint();
narrow.addEventListener("change", updateHint);

place();
updateReadout();
</script></body></html>
