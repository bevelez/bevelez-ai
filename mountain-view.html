<!doctype html>
<html lang="en" data-phase="day">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mountain View 3D — bevelez.ai</title>
  <meta name="description" content="A 3D map of Mountain View, California, by day and by night. Every street, park, creek and building from OpenStreetMap, with Moffett Field, the Googleplex and Shoreline Amphitheatre modeled in three dimensions." />
  <meta name="theme-color" content="#dfe8f3" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23dfe8f3'/%3E%3Cpath d='M12 48h40' stroke='%23b9c6d6' stroke-width='3' stroke-linecap='round'/%3E%3Crect x='16' y='28' width='10' height='20' rx='1.5' fill='%23f6f4ef' stroke='%231c1f26' stroke-width='2'/%3E%3Crect x='29' y='18' width='12' height='30' rx='1.5' fill='%23f6f4ef' stroke='%231c1f26' stroke-width='2'/%3E%3Crect x='44' y='34' width='8' height='14' rx='1.5' fill='%23f6f4ef' stroke='%231c1f26' stroke-width='2'/%3E%3Ccircle cx='50' cy='16' r='5' fill='%23ffd36b'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="./mountain-view.css?v=2" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="map"></div>
  <div id="labels"></div>

  <div class="hud top-left">
    <a class="pill" href="./vault.html" aria-label="Back to the archive">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      <span class="t">Archive</span>
    </a>
    <div class="pill title">Mountain View <small>3D</small></div>
  </div>

  <div class="hud top-right">
    <div class="pill clock" id="clock" title="Local time in Mountain View"></div>
    <button class="pill switch" id="phase" type="button" aria-label="Toggle day and night" aria-pressed="false">
      <span class="sun" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
      <span class="moon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></span>
      <span class="knob" aria-hidden="true"></span>
    </button>
    <button class="pill icon" id="home" type="button" aria-label="Reset the view" title="Reset the view">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 7v10h-5v-6H9v6H4V10z"/></svg>
    </button>
  </div>

  <div class="hud bottom">
    <div class="chips" id="chips" role="group" aria-label="Fly to a landmark"></div>
  </div>

  <div class="attrib">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors · heights © Microsoft</div>

  <div id="loading"><div><div class="ring"></div><div class="msg" id="loading-msg">Building Mountain View…</div></div></div>

  <script type="module" src="./mountain-view.js?v=2"></script>
</body>
</html>
