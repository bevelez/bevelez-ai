<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DJ KRONOS — 3D Cel-Shaded Rhythm Arena Brawler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Chakra+Petch:ital,wght@0,700;0,800;1,700;1,800&family=Inter:wght@500;700;900&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet" />

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <style>
    :root {
      --ink: #08060a;
      --paper: #ffffff;
      --gold: #ffe042;
      --orange: #ff7b19;
      --crimson: #e02424;
      --cyan: #24e5ff;
      --lime: #7ed92b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b1026;
      color: var(--paper);
      font-family: 'Chakra Petch', sans-serif;
      user-select: none;
    }

    /* Fullscreen 3D Three.js Arena Canvas */
    #three-stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Subtle Comic Halftone & Ink Frame Vignette */
    .halftone-vignette {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 52%, transparent 64%, rgba(6, 8, 20, 0.58) 100%);
    }

    /* =========================================================================
       1. TOP-LEFT STACKED HEALTH BARS (1:1 MATCH WITH TARGET SCREENSHOT)
       ========================================================================= */
    .top-left-hud {
      position: fixed;
      top: 24px;
      left: 34px;
      z-index: 4;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 340px;
    }

    .challenger-hp-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 800;
      font-size: 1.32rem;
      letter-spacing: 0.03em;
      color: #ffffff;
      text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
    }

    .hp-pips {
      display: inline-flex;
      gap: 4px;
      margin-left: 2px;
    }

    .hp-pip {
      width: 7px;
      height: 18px;
      background: #8be836;
      border: 2px solid #000;
      transform: skewX(-18deg);
    }

    .hp-pip.yellow {
      background: #ffe042;
    }

    .hp-pip.empty {
      background: #3a404d;
    }

    .bar-outer-challenger {
      width: 320px;
      height: 26px;
      background: rgba(14, 18, 26, 0.92);
      border: 3px solid #000;
      border-right: 6px solid var(--cyan);
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.85), inset 0 0 0 2px rgba(36, 229, 255, 0.35);
      transform: skewX(-20deg);
      padding: 3px;
      overflow: hidden;
    }

    .bar-fill-challenger {
      width: 66%;
      height: 100%;
      background: linear-gradient(90deg, #52b822 0%, #8be836 85%, #d4ff52 100%);
      border-right: 3px solid #000;
      transition: width 0.15s ease;
    }

    .kronos-hp-label {
      margin-top: 2px;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 800;
      font-size: 1.28rem;
      letter-spacing: 0.03em;
      color: #ffffff;
      text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
    }

    .bar-outer-kronos {
      width: 288px;
      height: 17px;
      background: rgba(14, 18, 26, 0.92);
      border: 3px solid #000;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.85);
      transform: skewX(-20deg);
      padding: 2px;
      overflow: hidden;
    }

    .bar-fill-kronos {
      width: 85%;
      height: 100%;
      background: linear-gradient(90deg, #c91e1e 0%, #ff3b1f 65%, #ff9824 100%);
      border-right: 3px solid #000;
      transition: width 0.15s ease;
    }

    .wave-status-pill {
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(16, 18, 28, 0.92);
      border: 2px solid #ffd428;
      box-shadow: 3px 3px 0 #000;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 800;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      color: #ffe042;
      text-transform: uppercase;
    }

    .damage-flash-overlay {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: radial-gradient(circle, rgba(255, 30, 56, 0.0) 40%, rgba(255, 24, 48, 0.55) 100%);
      opacity: 0;
      transition: opacity 0.14s ease;
    }

    /* =========================================================================
       2. MIDDLE-LEFT "12 HITS! / S-RANK" COMIC CALLOUT
       ========================================================================= */
    .left-rank-callout {
      position: fixed;
      top: 30%;
      left: 48px;
      z-index: 4;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      transform: rotate(-3deg);
    }

    .hits-line {
      display: flex;
      align-items: baseline;
      gap: 4px;
      line-height: 0.9;
    }

    .hits-number {
      font-family: 'Bangers', Impact, sans-serif;
      font-size: 5.4rem;
      letter-spacing: 0.02em;
      color: #e62222;
      -webkit-text-stroke: 3.5px #ffffff;
      text-shadow: 5px 5px 0 #000, -2px -2px 0 #000;
    }

    .hits-word {
      font-family: 'Bangers', Impact, sans-serif;
      font-size: 2.55rem;
      letter-spacing: 0.04em;
      color: #ffc424;
      -webkit-text-stroke: 2px #000;
      text-shadow: 3px 3px 0 #000;
    }

    .srank-word {
      margin-top: 2px;
      margin-left: 38px;
      font-family: 'Chakra Petch', Impact, sans-serif;
      font-weight: 900;
      font-size: 2.15rem;
      letter-spacing: 0.04em;
      color: #e03228;
      -webkit-text-stroke: 2px #000;
      text-shadow: 3px 3px 0 #000;
    }

    /* =========================================================================
       3. CENTER-TOP GIANT JAGGED "KRA-KOOM!" COMIC STARBURST
       ========================================================================= */
    .krakoom-container {
      position: fixed;
      top: 1.5%;
      left: 19%;
      width: 540px;
      height: 310px;
      z-index: 4;
      pointer-events: none;
      transform-origin: center center;
      opacity: 0;
      transform: scale(0.4) rotate(0deg);
      transition: opacity 0.12s ease, transform 0.15s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }

    .krakoom-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(5px 7px 0 #000000);
    }

    /* =========================================================================
       4. TOP-RIGHT CAMERA CONTROLS & AUDIO TRACKS DOCK
       ========================================================================= */
    .top-right-dock {
      position: fixed;
      top: 18px;
      right: 24px;
      z-index: 5;
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      transform: skewX(-3deg);
    }

    .cam-controls-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cam-view-pills {
      display: flex;
      align-items: center;
      gap: 3px;
      background: rgba(12, 14, 28, 0.88);
      border: 2px solid #000;
      padding: 3px;
    }

    .cam-pill {
      appearance: none;
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.78);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem;
      font-weight: 800;
      padding: 3px 6px;
      border: 1.5px solid #000;
      cursor: pointer;
      touch-action: manipulation;
      transition: background 0.08s ease, color 0.08s ease;
    }

    .cam-pill.active {
      background: var(--gold);
      color: #000;
    }

    .cam-pill:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    .cam-btn {
      appearance: none;
      font-family: 'Bangers', cursive;
      font-size: 1.05rem;
      letter-spacing: 0.05em;
      padding: 4px 12px;
      background: rgba(18, 20, 36, 0.94);
      color: var(--cyan);
      border: 2px solid var(--cyan);
      box-shadow: 2px 2px 0 #000;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.08s ease, background 0.08s ease;
    }

    .cam-btn:hover, .cam-btn:active {
      background: var(--cyan);
      color: #000;
      transform: translate(1px, 1px);
    }

    .cam-hint {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.68);
      background: rgba(0, 0, 0, 0.6);
      padding: 3px 6px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .audio-controls-row {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(12, 14, 28, 0.88);
      backdrop-filter: blur(8px);
      border: 2px solid #000;
      box-shadow: 3px 3px 0 #000;
      padding: 6px 10px;
    }

    .play-cta {
      appearance: none;
      font-family: 'Bangers', cursive;
      font-size: 1.05rem;
      letter-spacing: 0.05em;
      padding: 4px 10px;
      background: var(--gold);
      color: var(--ink);
      border: 1.5px solid #000;
      box-shadow: 2px 2px 0 var(--crimson);
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.08s ease, background 0.08s ease;
    }

    .play-cta:hover {
      transform: scale(1.03);
      background: #fff;
    }

    .play-cta.playing {
      background: var(--crimson);
      color: #fff;
      box-shadow: 2px 2px 0 var(--gold);
    }

    .track-pills {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .pill-btn {
      appearance: none;
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.78);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem;
      font-weight: 800;
      padding: 3px 6px;
      border: 1.5px solid #000;
      cursor: pointer;
      touch-action: manipulation;
    }

    .pill-btn.active {
      background: var(--cyan);
      color: #000;
    }

    .archive-mini {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      font-weight: 800;
      color: var(--gold);
      text-decoration: none;
      padding: 3px 6px;
      border: 1px solid rgba(255, 224, 66, 0.4);
      touch-action: manipulation;
    }

    /* =========================================================================
       5. BOTTOM-LEFT CLEAN LIVE LYRIC & BEAT BAR (.interactive-dock)
       ========================================================================= */
    .interactive-dock {
      position: fixed;
      bottom: 18px;
      left: 24px;
      z-index: 5;
      pointer-events: auto;
      width: min(440px, calc(100vw - 280px));
      background: rgba(12, 14, 28, 0.90);
      backdrop-filter: blur(8px);
      border: 2.5px solid #000;
      box-shadow: 4px 4px 0 #000, 0 0 0 1.5px rgba(36, 229, 255, 0.35);
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transform: skewX(-3deg);
    }

    .dock-lyric-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(5, 6, 14, 0.75);
      border-left: 3px solid var(--gold);
      padding: 5px 8px;
    }

    .section-chip {
      font-family: 'Bangers', cursive;
      font-size: 0.88rem;
      letter-spacing: 0.05em;
      background: var(--crimson);
      color: #fff;
      padding: 1px 6px;
      border: 1.5px solid #000;
      white-space: nowrap;
    }

    .lyric-text-main {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 0.84rem;
      font-weight: 700;
      color: #f4f7ff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dock-status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    /* =========================================================================
       6. BOTTOM-RIGHT ERGONOMIC ARCADE COMBAT DECK (DODGE, PUNCH, KICK)
       ========================================================================= */
    .bottom-right-arcade-deck {
      position: fixed;
      bottom: 18px;
      right: 24px;
      z-index: 5;
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      transform: skewX(-3deg);
    }

    .asd-btn {
      appearance: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      width: 72px;
      height: 70px;
      background: rgba(18, 20, 36, 0.95);
      color: #fff;
      border: 2.5px solid #000;
      box-shadow: 3px 3px 0 #000;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      transition: transform 0.06s ease, background 0.06s ease;
    }

    .asd-btn.pressed, .asd-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 #000;
      background: var(--gold);
      color: #000;
    }

    .btn-dodge .key-box { background: var(--cyan); color: #000; }
    .btn-punch .key-box { background: var(--gold); color: #000; }
    .btn-kick .key-box { background: var(--crimson); color: #fff; }

    .key-box {
      font-family: 'Bangers', cursive;
      font-size: 1.35rem;
      width: 32px;
      height: 28px;
      border: 1.5px solid #000;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .key-desc {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 0.72rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    @media (max-width: 900px) {
      .krakoom-container {
        left: 50%;
        transform: translateX(-50%);
        width: 300px;
        height: 180px;
      }
      .left-rank-callout {
        top: 20%;
        left: 14px;
        transform: scale(0.75);
      }
      .top-right-dock {
        top: 10px;
        right: 10px;
        transform: scale(0.85);
        transform-origin: top right;
      }
      .interactive-dock {
        bottom: 84px;
        left: 10px;
        width: calc(100vw - 20px);
        transform: none;
      }
      .bottom-right-arcade-deck {
        bottom: 10px;
        right: 10px;
        width: calc(100vw - 20px);
        justify-content: space-around;
        transform: none;
      }
      .asd-btn {
        width: 31%;
        height: 62px;
      }
    }
  </style>
</head>
<body>
  <div id="three-stage"></div>
  <div class="halftone-vignette"></div>
  <div class="damage-flash-overlay" id="damage-flash"></div>

  <!-- 1. TOP-LEFT STACKED HEALTH BARS (1:1 WITH TARGET SCREENSHOT) -->
  <div class="top-left-hud">
    <div class="challenger-hp-row">
      <span>CHALLENGER HP:</span>
      <span class="hp-pips" id="challenger-hp-pips">
        <span class="hp-pip yellow"></span>
        <span class="hp-pip"></span>
        <span class="hp-pip"></span>
        <span class="hp-pip"></span>
        <span class="hp-pip"></span>
        <span class="hp-pip"></span>
      </span>
    </div>
    <div class="bar-outer-challenger">
      <div class="bar-fill-challenger" id="player-hp-fill"></div>
    </div>

    <div class="kronos-hp-label" id="kronos-hp-text">KRONOS: 85%</div>
    <div class="bar-outer-kronos">
      <div class="bar-fill-kronos" id="boss-hp-fill"></div>
    </div>
    <div class="wave-status-pill" id="wave-status-pill">WAVE 1/3 · CYPHER VANGUARD (2 ACTIVE)</div>
  </div>

  <!-- 2. MIDDLE-LEFT "12 HITS! / S-RANK" CALLOUT -->
  <div class="left-rank-callout">
    <div class="hits-line">
      <span class="hits-number" id="hits-number">12</span>
      <span class="hits-word">HITS!</span>
    </div>
    <div class="srank-word" id="rank-word">S-RANK</div>
  </div>

  <!-- 3. CENTER-TOP EXPLOSIVE JAGGED "KRA-KOOM!" COMIC STARBURST -->
  <div class="krakoom-container" id="krakoom-burst">
    <svg class="krakoom-svg" viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="burstGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fff066" />
          <stop offset="55%" stop-color="#ffcc24" />
          <stop offset="100%" stop-color="#ff6b18" />
        </linearGradient>
        <linearGradient id="textFaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#fff78c" />
          <stop offset="55%" stop-color="#ffd428" />
          <stop offset="100%" stop-color="#ff5518" />
        </linearGradient>
        <pattern id="halftoneDots" width="8" height="8" patternUnits="userSpaceOnUse">
          <circle cx="4" cy="4" r="1.8" fill="rgba(217, 36, 36, 0.32)" />
        </pattern>
      </defs>

      <!-- Outer Red-Orange Jagged Starburst Border -->
      <polygon
        points="40,210 95,155 52,92 138,118 148,38 212,98 258,22 296,86 368,14 382,88 468,36 446,112 548,88 486,158 556,204 468,218 504,284 416,248 394,316 334,256 286,322 252,258 176,314 178,242 86,288 122,216"
        fill="#e02424"
        stroke="#08060a"
        stroke-width="8"
        stroke-linejoin="miter"
      />
      <!-- Inner Yellow-Gold Starburst Fill -->
      <polygon
        points="66,204 114,156 78,104 150,126 160,56 216,108 258,42 294,98 358,34 372,98 448,54 430,118 518,100 466,158 526,198 450,210 480,266 406,236 386,294 334,244 288,298 256,244 190,292 190,232 110,270 138,210"
        fill="url(#burstGrad)"
        stroke="#08060a"
        stroke-width="5"
      />
      <!-- Halftone Comic Dots Overlay Inside Starburst -->
      <polygon
        points="66,204 114,156 78,104 150,126 160,56 216,108 258,42 294,98 358,34 372,98 448,54 430,118 518,100 466,158 526,198 450,210 480,266 406,236 386,294 334,244 288,298 256,244 190,292 190,232 110,270 138,210"
        fill="url(#halftoneDots)"
      />

      <!-- 3D Extruded Comic Text "KRA-KOOM!" -->
      <g transform="translate(305, 192) rotate(-14)">
        <text
          id="krakoom-text-shadow"
          x="10"
          y="12"
          text-anchor="middle"
          font-family="'Bangers', Impact, sans-serif"
          font-size="112"
          letter-spacing="3"
          fill="#9e1414"
          stroke="#08060a"
          stroke-width="16"
          stroke-linejoin="round"
        >KRA-KOOM!</text>
        <text
          id="krakoom-text-main"
          x="0"
          y="0"
          text-anchor="middle"
          font-family="'Bangers', Impact, sans-serif"
          font-size="112"
          letter-spacing="3"
          fill="url(#textFaceGrad)"
          stroke="#08060a"
          stroke-width="10"
          stroke-linejoin="round"
        >KRA-KOOM!</text>
      </g>
    </svg>
  </div>

  <!-- 4. TOP-RIGHT CAMERA CONTROLS & AUDIO TRACKS DOCK -->
  <div class="top-right-dock">
    <div class="cam-controls-row">
      <div class="cam-view-pills" id="cam-view-pills">
        <button class="cam-pill active" id="cam-mode-orbit" data-mode="orbit" type="button" title="3/4 Elevated Courtyard View">ORBIT VIEW</button>
        <button class="cam-pill" id="cam-mode-action" data-mode="action" type="button" title="Action Brawler Cam">ACTION CAM</button>
      </div>
      <button class="cam-btn" id="btn-reset-cam" type="button" title="Reset Camera to Orbit View (Key: C)">[C] RESET CAM</button>
      <span class="cam-hint">360° DRAG · SCROLL ZOOM</span>
    </div>
    <div class="audio-controls-row">
      <button class="play-cta" id="btn-play" type="button">▶ PLAY LYRIA 3.5 BOSS TRACK</button>
      <div class="track-pills" id="track-pills">
        <button class="pill-btn active" data-track="flow" type="button" title="Google Flow Music Full Boss Rap Song">RAP</button>
        <button class="pill-btn" data-track="inst-1" type="button" title="Lyria RealTime Instrumental 1">INST 1</button>
        <button class="pill-btn" data-track="inst-2" type="button" title="Lyria RealTime Instrumental 2">INST 2</button>
        <button class="pill-btn" id="btn-load-flow" type="button" title="Load custom MP3/WAV">LOAD</button>
        <input type="file" id="flow-file-input" accept="audio/*" hidden />
      </div>
    </div>
  </div>

  <!-- 5. BOTTOM-LEFT CLEAN LIVE LYRIC & BEAT BAR -->
  <div class="interactive-dock">
    <div class="dock-lyric-row">
      <span class="section-chip" id="lyric-section">CHORUS</span>
      <div class="lyric-text-main" id="lyric-line">Tick-tock! Step in the ring, you on borrowed time!</div>
    </div>
    <div class="dock-status-row">
      <span class="archive-mini" id="tempo-readout">92 BPM · BEAT-WARP ON</span>
      <a href="./vault.html" class="archive-mini">← VAULT</a>
    </div>
  </div>

  <!-- 6. BOTTOM-RIGHT ERGONOMIC ARCADE COMBAT DECK (DODGE, PUNCH, KICK) -->
  <div class="bottom-right-arcade-deck">
    <button class="asd-btn btn-dodge" id="btn-a" type="button" title="Dodge / Weave (Key: A)">
      <span class="key-box">A</span>
      <span class="key-desc">DODGE</span>
    </button>
    <button class="asd-btn btn-punch" id="btn-s" type="button" title="Punch Combo (Key: S)">
      <span class="key-box">S</span>
